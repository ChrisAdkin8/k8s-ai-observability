# Loads ../manifests/dashboards/*.json straight from the repo. Grafana's file provider
# reads only .json, so the README.md alongside them is ignored.
#
# allowUiUpdates false on purpose: the file is the source of truth, and a change made
# only in the UI would be silently reverted on restart. Edit the JSON, or export from
# the UI back over it — see manifests/dashboards/README.md.
apiVersion: 1
providers:
  - name: gpu-sim
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
