# Artifact Hub repository metadata — THE OWNERSHIP CLAIM, not decoration.
#
# ⚠️ WITHOUT THIS, THE LISTING IS ANONYMOUS AND ANYONE CAN CLAIM THE SAME OCI
# REFERENCE. The chart still lists, with no verified-publisher badge and nothing
# tying it to this repository. The whole point of listing is that a stranger
# finds the chart and trusts it; an unverified listing undercuts the second half.
#
# ⚠️ FOR AN OCI REPOSITORY THIS IS NOT A FILE IN THE TREE THAT ARTIFACT HUB READS.
# It is verified by a metadata artefact PUSHED TO THE REGISTRY beside the chart,
# at the tag `artifacthub.io`. There is no web form for it and no branch it can
# be read from. That makes it a WORKFLOW step, which is precisely why it is easy
# to miss when the rest of the Artifact Hub setup is a browser form — so
# .github/workflows/publish-chart.yml pushes it from the same job that pushes the
# chart, and the two cannot drift apart.
#
# ─── HOW TO FILL THIS IN (one-time, needs a browser) ────────────────────────
# ⚠️ THE ORDER MATTERS AND IT IS NOT THE OBVIOUS ONE. The ID is not minted by
# hand or requested — Artifact Hub generates it when the repository is ADDED, and
# adding it makes Artifact Hub immediately try to index that OCI reference. So
# the chart has to be published FIRST or step 2 points at nothing.
#
#   1. Cut a release tag. .github/workflows/publish-chart.yml publishes the chart
#      and its verify job asserts an ANONYMOUS pull works — if the ghcr.io package
#      is still private, fix that before going near Artifact Hub, because it
#      cannot read a private package either.
#   2. https://artifacthub.io -> sign in -> Control Panel -> Repositories -> Add
#        kind:         Helm charts
#        name:         k8s-ai-observability
#        display name: GPU and vLLM Observability Simulation
#        url:          oci://ghcr.io/chrisadkin8/charts/k8s-ai-observability
#
#      ⚠️ NAME IT AFTER THE CHART, NOT AFTER THE PUBLISHER. The publisher-style
#      naming everyone recognises (bitnami, prometheus-community) belongs to
#      multi-chart HTTP repositories, where one entry holds the lot. An OCI entry
#      maps to ONE chart, so a publisher name would be spent on this chart alone
#      and the next one would need a second entry under a different scheme. The
#      cost is a stutter in the URL
#      (/packages/helm/k8s-ai-observability/k8s-ai-observability), which is
#      cosmetic and common — cert-manager/cert-manager reads the same way.
#
#      The display name is the one line a stranger reads before deciding to
#      click, so it says what this is rather than repeating the slug. No em
#      dashes: CLAUDE.md rule 13 covers catalog pages and this is one.
#      Both names were free on 2026-08-04 (checked via the Artifact Hub API).
#      Assume the name is PERMANENT — whether it can be renamed is unconfirmed.
#   3. The repository's CARD then shows an `ID` (a UUID). That is the value.
#      Put it in repositoryID below and commit.
#   4. Push the ownership artefact. The workflow does this on every publish, but
#      that means waiting for the NEXT release — so do it once by hand instead
#      and let the workflow keep it current afterwards:
#
#        oras push ghcr.io/chrisadkin8/charts/k8s-ai-observability:artifacthub.io \
#          --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#          artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
#      (`brew install oras`. Log in first: `oras login ghcr.io -u <user>` with a
#      PAT that has write:packages — the same scope the workflow's GITHUB_TOKEN
#      has, which is why the workflow itself needs no extra secret.)
#
# The tag `artifacthub.io` and both media types above are Artifact Hub's, not a
# convention this repo chose; it pulls that artefact and looks for the
# repository-metadata layer. Verified against artifacthub.io/docs 2026-08-04.
#
# Until repositoryID is real the publish step SKIPS LOUDLY rather than pushing a
# placeholder that would claim nothing while looking like a step that worked.
#
# The ID is not a secret. It identifies the listing; it does not authorise
# anything on its own — the claim works because only someone who can push to this
# registry path can place the artefact next to the chart.
#
# `owners` is OPTIONAL and deliberately omitted: it exists to display contact
# details on the listing, and the maintainer is already named in Chart.yaml.
# Adding it here would publish an email address to a second place with no
# additional verification value.

repositoryID: REPLACE_ME_WITH_THE_ARTIFACT_HUB_REPOSITORY_ID
