# Taskfile — single front door for both phases, on all three targets.
#
#   Install Task: https://taskfile.dev/docs/installation
#     brew install go-task/tap/go-task            # macOS/Linux
#     sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
#   Requires Task >= 3.32 (uses `prompt:` on the destructive tasks).
#
#   task                     # list everything
#   task local:up            # kind -> stacks -> checks. No cloud account, no spend.
#   task eks:up              # cluster -> stacks -> checks, end to end
#   task gke:grafana         # open the dashboards
#
# THE ONE-SHOT PATH IS `task local:up`. Everything this repo demonstrates is simulated,
# so the cloud targets are about proving it works on EKS/GKE — not a prerequisite for
# seeing it work at all. local needs no account, no credentials, no terraform.tfvars.
#
# Per-target tasks come from taskfiles/target.yml, included THREE times with a different
# CLOUD var — so eks, gke and local can never drift apart, because there is only one
# definition. This wraps scripts/, it does not replace it: the scripts remain runnable on
# their own and keep owning the ordering + drift guards.
version: '3'

# Optional: put GCP_PROJECT / GCP_REGION / AWS_REGION here instead of exporting
# them each session. Missing file is not an error. The local target reads none of them.
dotenv: ['.env']

includes:
  local:
    taskfile: taskfiles/target.yml
    vars: {CLOUD: local}
  eks:
    taskfile: taskfiles/target.yml
    vars: {CLOUD: eks}
  gke:
    taskfile: taskfiles/target.yml
    vars: {CLOUD: gke}

# Shared by the four cache:* tasks. Stated once rather than pasted four times, which
# would be four chances to later fix three of them. `x-` keys are ignored by Task; the
# anchor has to be defined before its first use, hence up here rather than beside them.
x-cache-needs-docker: &cache-needs-docker
  - sh: docker info >/dev/null 2>&1
    msg: |
      docker is not available (`docker info` failed). The caches are containers, so
      there is no dockerless path. They are optional: `task local:up` works without
      them, it just pulls every image from the internet on each new cluster.

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  tools:
    desc: Check the local prerequisites (kubectl, helm, kind/docker, terraform + cloud CLIs)
    silent: true
    cmds:
      # Only the target-agnostic tools are fatal. A missing gcloud is expected if you
      # only ever run EKS (and vice versa) — reporting it is useful, failing on it
      # would make `task tools` red for everyone who uses one target.
      #
      # terraform moved to optional when the local target landed: it is genuinely not
      # needed to run this repo end to end any more, and marking it fatal would tell
      # someone who only wants `task local:up` to install a tool they will never invoke.
      - |
        rc=0
        check() {  # $1 tool, $2 fatal|optional, $3 note
          if command -v "$1" >/dev/null 2>&1; then
            printf '  \033[32mok  \033[0m %-24s %s\n' "$1" "$3"
          elif [ "$2" = fatal ]; then
            printf '  \033[31mMISS\033[0m %-24s %s\n' "$1" "$3"; rc=1
          else
            printf '  \033[33m--  \033[0m %-24s %s\n' "$1" "$3 (not needed unless you use it)"
          fi
        }
        check kubectl                fatal    ""
        check helm                   fatal    ""
        check curl                   fatal    "used by verify.sh / grafana.sh"
        check python3                fatal    "used by verify.sh"
        check promtool               optional "task rule-tests — ships inside the Prometheus release"
        check kind                   optional "local — the no-cloud target"
        check docker                 optional "local — or podman; kind needs one of them"
        check terraform              optional "EKS/GKE — >= 1.6"
        check aws                    optional "EKS"
        check gcloud                 optional "GKE"
        check gke-gcloud-auth-plugin optional "GKE — the common silent miss"
        [ $rc -eq 0 ] || echo "  one or more REQUIRED tools are missing"
        exit $rc

  # ---- the checks that need no cloud, no cluster and no network --------------
  # All run in seconds. Between them they cover the things this repo produces that
  # are worth testing on their own: what the simulator emits, what the PromQL over
  # it computes, how the weekly drift check decides those names still match
  # upstream's, and whether the prose numbers still match the code they describe.
  # (Deliberately no count in this comment: a hardcoded "three" here went stale
  # the moment a fourth check landed — the exact drift class doc-claims exists
  # to catch.)

  # Validates the LLM simulator's Prometheus output: bucket monotonicity, +Inf
  # consistency, HELP/TYPE correctness, and that rendering /metrics observes
  # nothing. Run it before you push a change to scripts/llm-sim.py.
  selftest:
    desc: Validate the LLM simulator locally (no cluster needed)
    cmds:
      - python3 scripts/llm-sim.py --selftest

  # The compose path's GPU producer, against tests/contracts/dcgm-surface.json —
  # the same contract verify.sh check 3b holds the CLUSTER's exporter to. One file,
  # two independent producers, both asserted; that is what makes it parity rather
  # than self-consistency. Needs no docker, so it runs in the fast CI job.
  compose-selftest:
    desc: Check the compose GPU producer against the DCGM surface contract (no docker)
    cmds:
      - python3 compose/gpu-metrics-sim.py --selftest

  # Unit-tests every recording rule and alert in manifests/alerts/ with promtool:
  # thresholds on both sides of the boundary, the derived-series arithmetic, and
  # the alerts the live rig never drives. Run it before you push a change there.
  rule-tests:
    desc: Unit-test the alert + recording rules with promtool (no cluster needed)
    cmds:
      - ./scripts/rule-tests.sh

  # THE COLD PASS of a prompt review — the half a subagent cannot do.
  #
  # `/review-prompt` fans out prompt-fact-checker subagents to verify citations and
  # numbers. That half is mechanical and parallelisable, and a subagent is the right
  # tool for it. This is the other half: assumptions stated as facts, and costs the
  # prompt has not counted.
  #
  # ⚠️ IT RUNS A SEPARATE `claude -p` PROCESS ON PURPOSE, and a forked subagent is
  # NOT a substitute. A subagent is briefed by the author, who chooses what it is
  # told and which files it is pointed at, which is the exact channel the fresh
  # session exists to close. This process starts cold: it gets CLAUDE.md and the
  # prompt file and nothing else. See docs/development-method.md, stage 2.
  #
  # ⚠️ The cost is the point, not a defect. If a cold reader cannot work through the
  # prompt without redoing the digging that produced it, the prompt is not self
  # contained — and that is the most valuable finding this target can return.
  prompt-review:
    desc: 'Cold-read review of a prompt file (task prompt-review -- prompts/prompt-x.md)'
    silent: true
    cmds:
      - |
        f='{{.CLI_ARGS}}'
        if [ -z "$f" ]; then
          echo "usage: task prompt-review -- prompts/prompt-<subject>.md" >&2
          echo "  the mechanical half is /review-prompt inside a session; this is the cold pass" >&2
          exit 2
        fi
        if [ ! -f "$f" ]; then
          echo "ERROR: no such prompt file: $f" >&2
          echo "  available:" >&2
          ls prompts/*.md 2>/dev/null | sed 's/^/    /' >&2
          exit 1
        fi
        if ! command -v claude >/dev/null 2>&1; then
          echo "ERROR: 'claude' not found on PATH — this target IS the separate session." >&2
          exit 1
        fi
        echo "==> cold pass over $f (a new process, no context from this one)"
        claude -p "Review $f against this repository. You have not seen the work that
        produced it, and that is deliberate: report only what a cold reader can find.

        Look for exactly two things.
        1. Assumptions presented as facts. Anything asserted about behaviour that
           nothing here has observed, and that no cited file settles.
        2. Costs the prompt has not counted. A change touching files it does not
           mention, a check that will go red as a consequence, a step whose effort
           is priced as if the hard part were absent.

        Do NOT verify file:line citations or derived numbers. Subagents already did
        that, and repeating it wastes the one thing you have that they do not, which
        is that you were never told what to think.

        If any part of the prompt cannot be followed without information it does not
        contain, say so first and name what is missing. A prompt that needs its
        author present is not finished."

  # The MATCHING RULES of the weekly upstream drift check, against a committed
  # fixture instead of against upstream — so it needs no network and cannot drift
  # with the very input it exists to pin. It covers the `_total` suffix rule,
  # which fails silently: strip it blindly and the real run reports "in sync"
  # while a name we emit has no upstream counterpart at all.
  drift-test:
    desc: Unit-test the vLLM drift check's matching rules (no cluster, no network)
    cmds:
      - python3 scripts/check-vllm-buckets.py --selftest

  # Checks that numbers stated in prose still match the code they describe:
  # dashboard ids against the catalog README, "emits N" claims against what
  # `llm-sim.py --print` actually renders. Every check in the script is a
  # correction commit that already happened (25619->25620, the emits-count
  # corrections), mechanised. It holds no copy of any truth — see the script
  # header for what it deliberately does not check.
  doc-claims:
    desc: Check prose claims (dashboard ids, metric counts) against derived truth
    cmds:
      - python3 scripts/check-doc-claims.py

  # Collects the open items that are already MARKED in the files that own them —
  # CLAUDE.md rule 16. Derived, never a second copy: there is no TODO file here, and
  # adding one would duplicate every line this prints.
  #
  # ⚠️ It matches PHRASES, not the ⚠️ glyph. The glyph is the repo's general warning
  # marker and appears in tracked markdown by the hundred, so keying on it would return
  # almost the whole documentation set. (Count them with
  # `git ls-files '*.md' | xargs grep -o '⚠️' | wc -l` — deliberately not quoted here,
  # because a decorative number that carries no argument is a number that goes stale:
  # this comment said 91 while the true figure had reached 140.)
  # The phrase list below is CURATED,
  # which means it is also incomplete by construction: an open item written in new
  # words is silently missed. Printing nothing is therefore "the matchers found
  # nothing", not "there is no outstanding work" — and the task says so out loud
  # rather than letting a clean run read as a clean slate.
  #
  # Struck-through items are done (`⚠️ ~~claim~~ **DONE — what, when**`) and excluded.
  outstanding:
    desc: List open items already marked in the docs (derived, not a TODO file)
    silent: true
    cmds:
      - |
        pat='Unverified:|still (needs|unproven|marked unverified)|has fallen behind|remains unproven|not yet (built|proven|verified)'
        hits=$(git ls-files '*.md' | xargs grep -nE "$pat" 2>/dev/null | grep -v '~~' || true)
        if [ -n "$hits" ]; then
          printf '%s\n' "$hits" | sed 's/^/  /'
          printf '\n  %s marked item(s).\n' "$(printf '%s\n' "$hits" | wc -l | tr -d ' ')"
        else
          echo "  no marked items matched."
        fi
        echo "  ⚠️ curated phrase matchers — absence is not proof. See CLAUDE.md rule 16."

  # THE PRE-PUSH GATE. One command, every check that needs no cluster, no cloud
  # and no docker — run it before landing anything. It exists because 12 of the
  # repo's first 76 commits were corrections of work already on main, and most
  # of them would have been caught by the targets below, run in this order.
  #
  # chart goes last: it is the only step that may touch the network (helm
  # fetches the pinned dependencies on first run) and the only one needing a
  # tool beyond python3 + promtool. NOT included, deliberately:
  #   image / compose   need docker            (task image, task compose)
  #   verify.sh         needs a cluster        (task <target>:verify)
  #   the live drift check needs the network — its weekly CI job owns it
  # Finds pipes whose consumer exits before the producer finishes. Under pipefail
  # that turns a correct result into exit 141 — it has failed a chart publish on a
  # good archive, and made a CI filter skip the cluster jobs on a code change.
  # ⚠️ THE WHOLE DIRECTORY, NOT ONE FILE AT A TIME. verify.sh sources config.sh,
  # and the only clash shellcheck has found here — a name that is an array in one
  # and a string in the other — is invisible unless both are analysed together.
  # -S warning keeps the signal: `A && B || C` style notes are informational and
  # this repo uses that idiom deliberately, ~22 times.
  shellcheck:
    desc: Lint the shell at warning severity (CI runs the same command)
    cmds:
      - shellcheck -S warning scripts/*.sh

  sigpipe:
    desc: Find pipes into an early-exiting consumer in a pipefail file
    cmds:
      - python3 scripts/check-sigpipe.py --selftest
      - python3 scripts/check-sigpipe.py

  # ⚠️ THIS RAN ONLY IN CI UNTIL 2026-08-07, WHICH IS HOW IT SAT RED ON `main` FOR A
  # DAY. It was inline bash in the chart job, needing no cluster, no cloud and no
  # Docker — everything preflight covers — so a local gate could not see it and the
  # job that could is not a required check. One implementation, two callers now.
  second-copy:
    desc: Refuse a second committed copy of a dashboard, rule file or the simulator
    cmds:
      - python3 scripts/check-second-copy.py --selftest
      - python3 scripts/check-second-copy.py

  # The third layer of shell linting. `shellcheck` above covers scripts/*.sh and CI's
  # actionlint covers .github/workflows/ — neither reaches a composite action, because
  # actionlint only models workflow files and refuses to parse one.
  action-shell:
    desc: shellcheck the bash inside composite actions (actionlint cannot read them)
    cmds:
      - python3 scripts/check-action-shell.py --selftest
      - python3 scripts/check-action-shell.py

  # The MATCHING RULES of the weekly ruleset check, offline. The check itself needs the
  # network and the live GitHub API, so it runs weekly in CI and not here.
  required-checks-test:
    desc: Unit-test the branch-ruleset drift check's rules (no network)
    cmds:
      - python3 scripts/check-required-checks.py --selftest

  # The release gate's rules, offline. The gate itself only ever runs on a tag, so
  # every branch that REFUSES a release — a re-run whose newest attempt failed, a
  # truncated page read, a commit with no run at all, a deadline — is a branch a live
  # run exercises rarely or never. That is the argument for the fixtures.
  green-ci-test:
    desc: Unit-test the publish gate's rules (no network)
    cmds:
      - python3 scripts/check-green-ci.py --selftest

  preflight:
    desc: Run every no-cluster gate (selftests, rules, doc claims, chart) before pushing
    cmds:
      - task: selftest
      - task: compose-selftest
      - task: drift-test
      - task: required-checks-test
      - task: green-ci-test
      - task: doc-claims
      - task: sigpipe
      - task: second-copy
      - task: shellcheck
      - task: action-shell
      - task: rule-tests
      - task: chart

  # Derives the grafana.com upload from manifests/dashboards/*.json into dist/.
  # The repo files cannot be uploaded as-is: they bind to a datasource VARIABLE,
  # and the catalog requires the __inputs block instead — without it the uploader
  # rejects the file as "Old dashboard JSON format". Generated, never committed.
  dashboards:
    desc: Build the grafana.com-ready dashboards into dist/ (no cluster needed)
    cmds:
      - python3 scripts/dashboard-publish.py

  # Assembles the installable Helm chart into gitignored dist/charts/, then lints
  # and renders it both ways.
  #
  # ⚠️ THERE IS A BUILD STEP, AND `helm install ./charts/...` DOES NOT WORK.
  # Helm's .Files.Get cannot read outside the chart directory, so the chart
  # cannot reference manifests/dashboards/*.json or manifests/alerts/*.yaml
  # where they live — and a second committed copy is refused, here as
  # everywhere else in this repo. Assembling into dist/ is the only option
  # where the second copy never exists in the tree. The cost is this step.
  #
  #   task chart
  #   helm install rig dist/charts/k8s-ai-observability --set releaseLabel=<yours>
  #   helm test rig --logs      # <- the two silent labels are checked HERE
  chart:
    desc: Build the Helm chart into dist/, then lint and render it (needs helm)
    preconditions:
      - sh: command -v helm >/dev/null 2>&1
        msg: |
          helm is not on PATH. The chart cannot even be RENDERED without it:
          Helm refuses to load a chart whose declared dependencies are absent
          from charts/, even when their condition is false, so the build has to
          fetch them.
    cmds:
      - python3 scripts/chart-build.py --selftest
      - python3 scripts/chart-build.py
      - helm lint dist/charts/k8s-ai-observability
      # Both ways round, because they exercise different code paths: with the
      # stack disabled (the BYO case this chart exists for) and enabled (the
      # greenfield case, where the subchart's own templates render too).
      - helm template rig dist/charts/k8s-ai-observability >/dev/null
      - helm template rig dist/charts/k8s-ai-observability --set kubePrometheusStack.enabled=true >/dev/null
      - cmd: |
          echo
          echo "  helm install rig dist/charts/k8s-ai-observability \\"
          echo "    --set releaseLabel=<your monitoring release>"
          echo
          echo "  helm test rig --logs   # the two silent labels are checked HERE"
        silent: true

  # Builds the simulator image from scripts/llm-sim.py and smoke-tests it the way
  # CI does — run it, scrape it, assert the surface. Building alone would only
  # prove the Dockerfile parses.
  #
  # ⚠️ THIS IS NOT HOW THE RIG RUNS THE SIMULATOR. install.sh builds the
  # ConfigMap from the file and the compose stack mounts it; an image-based
  # Deployment would pin a tag and a local edit would stop reaching the cluster
  # silently. The image is for people consuming the simulator from outside this
  # repo. See docs/llm-simulation.md#the-container-image.
  image:
    desc: Build the simulator container image and smoke-test it (needs docker)
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: |
          docker is not available (`docker info` failed). This task builds and
          RUNS the simulator image; there is no dockerless path.
    cmds:
      - docker build -t vllm-metrics-sim:local .
      - |
        set -eu
        cid=$(docker run -d -p 9401:9401 vllm-metrics-sim:local)
        trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do
          curl -sf http://localhost:9401/metrics -o /tmp/llm-sim-scrape.txt && break
          sleep 1
        done
        test -s /tmp/llm-sim-scrape.txt || { echo "the image served nothing" >&2; exit 1; }
        grep -q '^# HELP vllm:num_requests_running ' /tmp/llm-sim-scrape.txt
        grep -q '^vllm:num_requests_running{'        /tmp/llm-sim-scrape.txt
        echo "  ok  $(grep -c '^vllm:' /tmp/llm-sim-scrape.txt) vllm: sample lines"
        # The payload must BE scripts/llm-sim.py, not a copy that has drifted
        # from it. A drifted simulator would be undetectable from outside.
        a=$(docker run --rm --entrypoint sha256sum vllm-metrics-sim:local /app/llm_sim.py | cut -d' ' -f1)
        b=$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' scripts/llm-sim.py)
        [ "$a" = "$b" ] || { echo "image payload differs from scripts/llm-sim.py" >&2; exit 1; }
        echo "  ok  payload matches scripts/llm-sim.py ($a)"

  # ---- pull-through image caches (local target, opt-in) -----------------------
  # They persist across `kind delete`, which is the whole point: that is what throws
  # the node's image store away and makes every cold build re-pull ~915 MB.
  #
  # HERE RATHER THAN IN taskfiles/target.yml, though only `local` uses them: that file
  # exists so eks, gke and local cannot drift apart, and a task meaningless on two of
  # the three targets is not something they should share a definition for. These sit
  # with `image` and `compose`, the other Docker-side tasks outside a cluster's
  # lifecycle.
  #
  # ⚠️ ENUMERATED AS cache:<verb>, NOT `cache -- <verb>`, AND THE DIFFERENCE IS NOT
  # COSMETIC. `--` is this repo's passthrough idiom, for handing arguments to a tool
  # that owns its own vocabulary: `compose -- down|logs|ps` reaches `docker compose`,
  # which has dozens of subcommands, and `load -- ramp` reaches a script's argument.
  # These four verbs are a CLOSED set this repo defines, so they belong in
  # `task --list` where they can be read, rather than hidden in one task's desc
  # string. The `:` here groups verbs rather than naming a target, which is what it
  # means under local:/eks:/gke:; those come from includes and stay grouped together
  # in the listing regardless.
  #
  # Deliberately still four thin wrappers over scripts/registry-cache.sh, which keeps
  # its own up|down|status interface and stays runnable on its own. Task is the front
  # door, not a replacement for the scripts (taskfiles/target.yml says the same).
  cache:up:
    desc: Start the pull-through image caches (makes every cold local:up after the next one faster)
    preconditions: *cache-needs-docker
    cmds: [./scripts/registry-cache.sh up]

  cache:status:
    desc: Show which pull-through caches are running, and how much each has cached
    preconditions: *cache-needs-docker
    cmds: [./scripts/registry-cache.sh status]

  cache:down:
    desc: Stop and remove the pull-through caches, KEEPING what they have cached
    preconditions: *cache-needs-docker
    cmds: [./scripts/registry-cache.sh down]

  # Separate task rather than `cache:down -- --purge`: mixing the two conventions in
  # one command line is the worst of both, and discarding a warmed cache is worth
  # naming out loud — it is the one action here that costs you a slow rebuild.
  cache:purge:
    desc: Stop and remove the pull-through caches AND discard every cached blob
    preconditions: *cache-needs-docker
    cmds: [./scripts/registry-cache.sh down --purge]

  # ---- the no-Kubernetes path ------------------------------------------------
  # Both boards and both alert sets in under a minute, reading the same dashboards,
  # rules, simulator and profiles the cluster does. See compose/README.md for what it
  # deliberately cannot exercise.
  compose:
    desc: 'Both dashboards without Kubernetes (task compose -- down|logs|ps)'
    dir: '{{.ROOT_DIR}}/compose'
    interactive: true
    preconditions:
      - sh: docker compose version >/dev/null 2>&1
        msg: |
          The docker compose plugin is not available (`docker compose version` failed).
          Install Docker Desktop, or the compose plugin for your runtime:
            https://docs.docker.com/compose/install/
    cmds:
      - 'docker compose {{.CLI_ARGS | default "up -d"}}'
      - cmd: |
          {{if not .CLI_ARGS}}echo
          echo "  GPU:        http://localhost:${GRAFANA_PORT:-3000}/d/gpu-sim-dcgm"
          echo "  LLM:        http://localhost:${GRAFANA_PORT:-3000}/d/llm-sim-overview"
          echo "  Prometheus: http://localhost:${PROMETHEUS_PORT:-9090}"
          echo
          echo "  Alerts need a few minutes to clear their 'for:' durations."
          echo "  Stop with: task compose -- down"{{end}}
        silent: true

  # Cluster-agnostic escape hatch: the scripts act on the CURRENT kubecontext, so
  # this is here for when you already know which cluster you are pointed at.
  # Prefer the namespaced forms (task eks:load) — they guard the context first.
  load:
    desc: 'Drive a utilisation curve on the CURRENT context (task load -- ramp|spikes)'
    cmds:
      - ./scripts/drive-load.sh {{.CLI_ARGS | default "ramp"}}
