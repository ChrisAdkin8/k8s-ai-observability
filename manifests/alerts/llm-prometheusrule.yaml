# Recording rules and alerts over the simulated vLLM metrics.
#
# Alert names contain "LLM" for readability and grouping. verify.sh selects them
# by EXACT name, never by wildcard — a wildcard is how an unrelated
# always-firing alert can silently satisfy a check that looks meaningful.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-simulation-alerts
  namespace: monitoring   # must match config.sh MONITORING_NS (install.sh guards drift)
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # ---- recording rules -----------------------------------------------
    # WHY: histogram_quantile over a 5m rate is expensive to repeat in every
    # panel and every alert, and computing it once means the dashboard and the
    # alert can never disagree about what "p95 TTFT" means.
    #
    # ⚠️ Aggregated `by (model_name)`, NOT globally. A global quantile merges the
    # healthy and saturated tenants into one number that describes neither, and
    # hides the degraded one — which is the tenant the alert exists to catch.
    #
    # These are this repo's own series, so they carry source="simulated". The
    # vllm:* series they read do NOT: real vLLM emits no such label, and adding
    # one would break exact-match joins against a real deployment.
    - name: llm.simulation.derived
      rules:
        - record: llm:ttft:p50_5m
          expr: >-
            histogram_quantile(0.50, sum by (model_name, le)
              (rate(vllm:time_to_first_token_seconds_bucket[5m])))
          labels: { source: simulated }

        - record: llm:ttft:p95_5m
          expr: >-
            histogram_quantile(0.95, sum by (model_name, le)
              (rate(vllm:time_to_first_token_seconds_bucket[5m])))
          labels: { source: simulated }

        - record: llm:ttft:p99_5m
          expr: >-
            histogram_quantile(0.99, sum by (model_name, le)
              (rate(vllm:time_to_first_token_seconds_bucket[5m])))
          labels: { source: simulated }

        # Renamed in the V1 engine: vllm:time_per_output_token_seconds became
        # vllm:inter_token_latency_seconds. The RULE name is unchanged — `tpot`
        # is what everyone calls the measurement, and renaming the recorded
        # series would break every dashboard and alert built on it for no gain.
        # ⚠️ Do not point this at vllm:request_time_per_output_token_seconds,
        # which current vLLM also exposes: that is a per-request mean, not a
        # per-token histogram, and the quantile means something different.
        - record: llm:tpot:p95_5m
          expr: >-
            histogram_quantile(0.95, sum by (model_name, le)
              (rate(vllm:inter_token_latency_seconds_bucket[5m])))
          labels: { source: simulated }

        # Prefix cache reuse, as the RATIO and never as either counter.
        #
        # Upstream counts prompt TOKENS, so both counters scale with traffic and
        # neither says anything on its own — a busy tenant with a cold cache
        # out-counts an idle one with a warm cache on both of them. The ratio is
        # what a vLLM operator plots, and it is the query that replaces the v0
        # gauge this metric pair superseded (see METRIC_RESHAPES in
        # scripts/llm-sim.py): a panel bound to vllm:gpu_prefix_cache_hit_rate
        # cannot be repaired by substituting a name, only by writing this.
        #
        # ⚠️ The denominator is clamped like GPUHighMemoryUsage's, but at an
        # EPSILON rather than at 1. clamp_min(x, 1) is right for a byte count and
        # wrong for a rate: a low-traffic real deployment can genuinely sit below
        # one queried token per second, and flooring there would quietly
        # under-report exactly the deployments least able to notice. With no
        # traffic both rates are zero and 0/1e-9 is 0 — a present series flat at
        # zero, which is what a panel needs and what +Inf or NaN would not be.
        # hits <= queries by construction, so the numerator can never be positive
        # while the denominator is zero.
        - record: llm:prefix_cache:hit_ratio5m
          expr: >-
            sum by (model_name) (rate(vllm:prefix_cache_hits_total[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:prefix_cache_queries_total[5m])), 1e-9)
          labels: { source: simulated }

        # ---- the request phase breakdown, as MEANS and not as quantiles ----
        #
        # queue -> prefill -> decode is where a request's time went, and these
        # four rules are what the breakdown panel plots. ⚠️ FOUR, not three:
        # llm:e2e:mean5m is the right-hand side of "does the breakdown add up",
        # and without it that test cannot be written over the recorded rules at
        # all. e2e is an existing series that never had a mean rule, so its
        # absence does not announce itself.
        #
        # ⚠️ AND IT HAS TO BE A RULE RATHER THAN AN INLINED EXPRESSION, because
        # of the source label. Recorded series here carry source="simulated" and
        # raw vllm:* series do not, so combining three recorded means with an
        # inlined rate(vllm:e2e_..._sum)/rate(..._count) matches NOTHING, and the
        # obvious repair — on(model_name) — then drops source from the result.
        # VERIFIED with promtool; the failure reads as an arithmetic bug:
        #     exp: {model_name="m", source="simulated"} 0E+00
        #     got: {model_name="m"}                     0E+00
        # Recording all four with the same label set makes the comparison
        # label-symmetric and needs no on() clause.
        #
        # ⚠️ MEANS, NOT p95s, and both reasons are measured.
        #
        # 1. Quantiles are not additive, so a p95 breakdown does not add up. On
        #    the steady tenant, with perfect resolution and no bucket error:
        #      p95:  0.000 + 0.094 + 7.379 = 7.473  vs p95(e2e) 7.468   NO
        #      mean: 0.001 + 0.080 + 5.020 = 5.101  vs mean(e2e) 5.101  EXACT
        #    A stacked breakdown whose segments do not sum to the total reads as
        #    a bug in the rig, forever, to everyone who looks at it.
        #
        # 2. E2E_BUCKETS cannot resolve prefill at this operating point.
        #    base_ttft_seconds is 0.08 and the first boundary is 0.3, so every
        #    prefill observation lands in the first bucket and
        #    histogram_quantile interpolates from zero across it — MEASURED at
        #    ~3.03x on BOTH shipped tenants (0.095s reported as 0.285s). For
        #    scale, the inter-token-latency caveat already on the board is a
        #    1.08x effect.
        #
        # A histogram mean has NO bucket dependence at all — _sum and _count are
        # exact — so it is immune to (2), and it is additive, so it is immune to
        # (1). Do not "fix" (2) by adding a finer low-end bucket list: the
        # boundaries are transcribed from upstream and are what makes a query
        # built here transfer unchanged. Real vLLM reads exactly as high, which
        # is why the caveat is documented on the catalog page instead.
        #
        # ⚠️ Clamped at an EPSILON, not at 1, for the same reason
        # llm:prefix_cache:hit_ratio5m is: a low-traffic tenant can genuinely
        # complete fewer than one request per second, and flooring at 1 would
        # silently under-report the mean of precisely the deployments least
        # likely to notice. An idle tenant reads 0/1e-9 = 0 — a flat line rather
        # than a NaN. VERIFIED with promtool against a zero-traffic fixture.
        - record: llm:queue:mean5m
          expr: >-
            sum by (model_name) (rate(vllm:request_queue_time_seconds_sum[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:request_queue_time_seconds_count[5m])), 1e-9)
          labels: { source: simulated }

        - record: llm:prefill:mean5m
          expr: >-
            sum by (model_name) (rate(vllm:request_prefill_time_seconds_sum[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:request_prefill_time_seconds_count[5m])), 1e-9)
          labels: { source: simulated }

        - record: llm:decode:mean5m
          expr: >-
            sum by (model_name) (rate(vllm:request_decode_time_seconds_sum[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:request_decode_time_seconds_count[5m])), 1e-9)
          labels: { source: simulated }

        - record: llm:e2e:mean5m
          expr: >-
            sum by (model_name) (rate(vllm:e2e_request_latency_seconds_sum[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:e2e_request_latency_seconds_count[5m])), 1e-9)
          labels: { source: simulated }

        # The one phase these buckets resolve tolerably — MEASURED at 1.26x on
        # the steady tenant and 1.12x on the saturated one, against 3.03x for
        # prefill.
        #
        # ⚠️ There is deliberately NO llm:prefill:p95_5m and NO llm:e2e:p95_5m
        # here. Prefill is the 3.03x case above. e2e is WORSE than decode under
        # saturation — 1.71x, 67.97s reported as 116.26s — and the saturated
        # tenant is the one the board exists to show. A recorded series is
        # exactly how a wrong number acquires an air of authority, so the two
        # that cannot be read straight are not recorded at all.
        - record: llm:decode:p95_5m
          expr: >-
            histogram_quantile(0.95, sum by (model_name, le)
              (rate(vllm:request_decode_time_seconds_bucket[5m])))
          labels: { source: simulated }

        - record: llm:tokens:generation_rate5m
          expr: sum by (model_name) (rate(vllm:generation_tokens_total[5m]))
          labels: { source: simulated }

        - record: llm:tokens:prompt_rate5m
          expr: sum by (model_name) (rate(vllm:prompt_tokens_total[5m]))
          labels: { source: simulated }

        # Cross-domain, and CLUSTER-AGGREGATE on purpose.
        #
        # ⚠️ This correlates two INDEPENDENTLY DRIVEN signals. Nothing in this rig
        # makes GPU utilisation follow LLM load — see docs/llm-simulation.md. It
        # demonstrates the query pattern and the dashboard wiring; it does not
        # show causation. Treating it as causal would be reading a relationship
        # into noise.
        #
        # It also only works because DCGM_FI_DEV_POWER_USAGE is itself synthesised
        # by the recording rules in gpu-prometheusrule.yaml — derived metrics
        # layering on derived metrics.
        - record: llm:tokens_per_watt:5m
          expr: >-
            sum(rate(vllm:generation_tokens_total[5m]))
            / sum(DCGM_FI_DEV_POWER_USAGE)
          labels: { source: simulated }

        # ---- the TTFT service-level indicator -------------------------------
        #
        # THE SLI IS A RATIO AT A BUCKET BOUNDARY, NOT A PERCENTILE, and that is
        # the whole design. Everywhere else in this file a quantile carries a
        # caveat: prefill reads 3.03x high, e2e 1.71x under saturation, ITL 1.08x
        # — all of it because histogram_quantile INTERPOLATES INSIDE a bucket.
        #
        # A ratio evaluated AT a boundary does no interpolation and carries no
        # bucket-width dependence, so none of those caveats apply to it. The
        # bucket layout is therefore not an obstacle to an SLO; it is the
        # constraint that says how to build one: the threshold must BE a boundary.
        #
        # ⚠️ THE BOUNDARY IS 2.5, AND `le="2.5"` IS NOT A FREE CHOICE OF SPELLING.
        # TTFT_BUCKETS (scripts/llm-sim.py) steps ... 1.0, 2.5, 5.0 ... — there is
        # NO 2.0 bucket. `le="2"` matches nothing, the ratio evaluates to nothing,
        # and the burn-rate alerts below never fire: green forever on a rule that
        # reads correctly. Same failure genre as `> 90` where `> 0.9` was meant.
        # If you change the boundary it must be a member of that list, and the
        # promtool cases in tests/rules/llm-rules_test.yaml must move with it.
        #
        # ⚠️ NOT 1.0, though it is also a real boundary: the steady tenant measures
        # 99.368% there against a 99% target — 0.37 points of headroom, which
        # ordinary jitter crosses. The healthy tenant would report a blown budget
        # at random. At 2.5 it measures 100% and the saturated one 0.32%.
        #
        # ⚠️ "Exact" has a CONDITION. It holds because numerator and denominator
        # are the same histogram, on the same target, at the same scrape
        # timestamps, so rate()'s extrapolation factor is common to both and
        # cancels. Across replicas whose scrapes are out of phase it does not.
        # One pod per model here; see the catalog page before running four.
        #
        # ⚠️ Each rule uses ITS OWN window in BOTH range vectors. A slo_ratio6h
        # built on [5m] returns a plausible number — the 5m ratio under a 6h name
        # — so every threshold test still passes while the slow-burn alert
        # watches the wrong window. Asserted in the promtool cases.
        #
        # clamp_min at an EPSILON, not at 1, for the reason given above for the
        # prefix-cache denominator: flooring a rate at 1 under-reports exactly the
        # low-traffic deployments least likely to notice. An idle tenant reads
        # 0/1e-9 = 0 rather than NaN — which the alerts below must then guard for.
        - record: llm:ttft:slo_ratio5m
          expr: >-
            sum by (model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[5m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:time_to_first_token_seconds_count[5m])), 1e-9)
          labels: { source: simulated }

        - record: llm:ttft:slo_ratio30m
          expr: >-
            sum by (model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[30m]))
            / clamp_min(sum by (model_name)
                (rate(vllm:time_to_first_token_seconds_count[30m])), 1e-9)
          labels: { source: simulated }

        - record: llm:ttft:slo_ratio1h
          expr: >-
            sum by (model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[1h]))
            / clamp_min(sum by (model_name)
                (rate(vllm:time_to_first_token_seconds_count[1h])), 1e-9)
          labels: { source: simulated }

        # ⚠️ NOT EXERCISED ON THIS RIG. A kind cluster lives minutes; this window
        # needs six hours, so it never fills here and the slow-burn alert below
        # cannot be watched moving. Same situation as LLMKVCacheSaturated, and
        # handled the same way: the promtool cases synthesise six hours in about a
        # second, with no cluster. To watch it on the rig, shorten both windows in
        # a fork of this rule — do not shorten them here, or the burn multipliers
        # stop meaning what the alert annotations say they mean.
        - record: llm:ttft:slo_ratio6h
          expr: >-
            sum by (model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[6h]))
            / clamp_min(sum by (model_name)
                (rate(vllm:time_to_first_token_seconds_count[6h])), 1e-9)
          labels: { source: simulated }

    # ---- alerts ---------------------------------------------------------
    - name: llm.simulation.rules
      rules:
        # EXERCISED BY DEFAULT: the llm-saturated Deployment keeps this firing.
        # That is deliberate — install.sh creates the condition, verify.sh only
        # observes it, exactly as gpu-busy keeps GPUHighUtilization firing.
        #
        # 2s sits between the steady tenant (~0.1s) and the saturated one
        # (~60s, the real queue wait: 160 / 2.74 by Little's Law). Those three
        # numbers interlock with the profile arithmetic in
        # manifests/llm/10-profiles.yaml, so change one and re-check the others.
        - alert: LLMHighTTFT
          expr: llm:ttft:p95_5m > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model_name }} p95 time-to-first-token above 2s"
            description: >-
              p95 TTFT has been over 2s for 2m ({{ $value | printf "%.2f" }}s).
              Requests are queueing faster than they can be served (simulated).

        # EXERCISED BY DEFAULT: llm-saturated plateaus at ~160 waiting.
        - alert: LLMQueueBacklog
          expr: vllm:num_requests_waiting > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model_name }} has {{ $value }} requests queued"
            description: "Offered load has exceeded serving capacity for 5m (simulated)."

        # NOT exercised by default — the shipped profiles keep KV cache well
        # under 90%. To test it, lower kv_cache_tokens_capacity in a profile:
        #   kubectl -n llm-sim edit configmap llm-profile-steady
        #
        # Renamed in the V1 engine: vllm:gpu_cache_usage_perc became
        # vllm:kv_cache_usage_perc, because V1 dropped CPU KV-cache offload and
        # the "gpu_" prefix stopped distinguishing anything. Still a FRACTION
        # (0-1), so `> 0.9` is correct and `> 90` can never fire.
        - alert: LLMKVCacheSaturated
          expr: vllm:kv_cache_usage_perc > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model_name }} KV cache above 90%"
            description: "Simulated KV-cache utilisation over 90% for 5m."

        # NOT exercised by default — the simulator is always up. To test it:
        #   kubectl -n llm-sim scale deploy/llm-steady --replicas=0
        - alert: LLMMetricsAbsent
          expr: absent(vllm:num_requests_running)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No LLM serving metrics are being scraped"
            description: >-
              vllm:num_requests_running absent for 5m — is the llm-sim
              ServiceMonitor matching, and are the simulator pods Running?

        # ---- error-budget burn, over the SLI recorded above -----------------
        #
        # THE OBJECTIVE: 99% of requests reach a first token within 2.5s, over 30
        # days. Two alerts, the standard fast/slow pair.
        #
        # ⚠️ THE 30d BUDGET APPEARS IN NO QUERY. It fixes what 14.4 and 6 MEAN —
        # burning at 14.4x for 1h consumes 2% of a 30-day budget, and at 6x for 6h
        # consumes 5% — but nothing here computes over 30 days, and this rig has
        # minutes of data. Do not go looking for a 30d window.
        #
        # ⚠️ BOTH WINDOWS MUST BREACH. That is what makes a single spike not a
        # page: the long window says the budget is genuinely burning, the short
        # one says it is still burning NOW rather than hours ago.
        #
        # ⚠️ THE TARGET IS SPELLED THREE WAYS AND PromQL CANNOT FACTOR IT OUT:
        # once in the prose above, once as the `0.01` divisor below, and once
        # inside 14.4/6, which mean what they mean only against a 1% budget. The
        # division is removable — `(1 - ratio) / 0.01 > 14.4` is algebraically
        # `(1 - ratio) > 0.144` — but burn rate is the quantity operators reason
        # about and the term the SRE literature uses, so it stays. WHAT HOLDS THE
        # THREE SPELLINGS TOGETHER IS A TEST: llm-rules_test.yaml pins the
        # effective threshold either side of an error ratio of 0.144, so a divisor
        # and a multiplier drifting apart fails there however either is written.
        #
        # ⚠️ NO `for:` ON EITHER, AND THAT IS A DECISION, NOT AN OMISSION. Every
        # other alert in this file carries one. Here the long window already
        # provides exactly the smoothing a `for:` would add, and stacking both
        # would delay a genuine fast burn by the `for:` on top of an hour of
        # averaging. Do not "fix" this by adding one.
        #
        # ⚠️ THE TRAFFIC GUARD IS NOT OPTIONAL, AND ITS WINDOW IS PER-ALERT.
        # With no traffic the clamp above gives 0/1e-9 = 0, so the error ratio is
        # 1.0 and burn pins at 100x: WITHOUT THE GUARD THESE FIRE HARDEST ON A
        # TENANT SERVING NOTHING AT ALL. The guard window must match the alert's
        # own SHORT window — 5m here, 30m on the slow one. A 5m guard on the slow
        # alert would silence a tenant that burned budget for hours and went idle
        # ten minutes ago, which is a safety check disabling the alarm.
        #
        # ⚠️ `on (model_name)` IS LOAD-BEARING. The recorded ratios carry
        # source="simulated"; the raw vllm: counter does not. A plain `and`
        # matches on ALL labels, finds nothing, and silently suppresses the alert.
        # Same mismatch documented for llm:e2e:mean5m above — though note `and`
        # takes its result labels from the LEFT, so unlike the division case there
        # `source` survives and nothing needs recovering.
        #
        # ⚠️ WHAT THIS OBJECTIVE DOES NOT COVER: requests that never reach a first
        # token contribute no observation at all, so a total stall is SILENT here
        # — and the guard then suppresses these alerts by design. LLMQueueBacklog
        # is what fires when requests arrive and never complete; LLMMetricsAbsent
        # when the series stop entirely. This is a latency objective, not an
        # availability one.
        #
        # NOT EXERCISED BY DEFAULT on the slow alert: its 6h window never fills on
        # this rig. Both are covered on both sides in llm-rules_test.yaml.
        - alert: LLMTTFTErrorBudgetFastBurn
          expr: >-
            (1 - llm:ttft:slo_ratio1h) / 0.01 > 14.4
            and
            (1 - llm:ttft:slo_ratio5m) / 0.01 > 14.4
            and on (model_name)
            (sum by (model_name)
              (rate(vllm:time_to_first_token_seconds_count[5m])) > 0)
          labels:
            severity: critical
          annotations:
            summary: "Model {{ $labels.model_name }} is burning TTFT error budget fast"
            description: >-
              Over 14.4x burn on both the 1h and 5m windows — at this rate 2% of
              the 30d budget for "99% of requests reach a first token within
              2.5s" goes in an hour ({{ $value | printf "%.1f" }}x).

        - alert: LLMTTFTErrorBudgetSlowBurn
          expr: >-
            (1 - llm:ttft:slo_ratio6h) / 0.01 > 6
            and
            (1 - llm:ttft:slo_ratio30m) / 0.01 > 6
            and on (model_name)
            (sum by (model_name)
              (rate(vllm:time_to_first_token_seconds_count[30m])) > 0)
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model_name }} is burning TTFT error budget"
            description: >-
              Over 6x burn on both the 6h and 30m windows — at this rate 5% of the
              30d budget for "99% of requests reach a first token within 2.5s"
              goes in six hours ({{ $value | printf "%.1f" }}x).
