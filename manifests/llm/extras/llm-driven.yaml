# Opt-in load-driving target for scripts/drive-llm-load.sh.
#
# NOT applied by install.sh — `kubectl apply -f manifests/llm/` is
# non-recursive, so this subdirectory is skipped. Apply it yourself:
#
#   kubectl apply -f manifests/llm/extras/
#   ./scripts/drive-llm-load.sh ramp
#
# This mirrors manifests/workloads/extras/gpu-driven.yaml exactly: it starts
# idle and the driver walks its profile over time. It exists so the driver never
# has to touch llm-steady or llm-saturated, whose steady states verify.sh
# depends on.
#
# ⚠️ Its model_name differs from both defaults. Sharing one would merge the
#    series in the by(model_name) recording rules and break verify.sh's L3
#    check the first time you drove this to saturation.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-profile-driven
  namespace: llm-sim
  labels:
    app.kubernetes.io/part-of: gpu-sim-llm
data:
  # Starts idle (well under the 2.74 rps capacity), like gpu-driven starts at 0-5.
  #
  # prefix_cache_hit_rate sits between the two fixed tenants, so the prefix-cache
  # panel draws three distinguishable lines while this one is being driven.
  # Chosen rather than modelled — see 10-profiles.yaml. It changes no latency by
  # construction, so arrival rate is still the only thing that moves TTFT here.
  #
  # ⚠️ JSON below, so the comments have to live up here.
  profile.json: |
    {
      "model_name": "sim-llama-3-8b-driven",
      "arrival_rate_rps": 0.4,
      "max_concurrency": 16,
      "max_in_flight": 176,
      "prompt_tokens":     {"mean": 512, "stddev": 128},
      "generation_tokens": {"mean": 256, "stddev": 64},
      "base_ttft_seconds": 0.08,
      "base_itl_seconds": 0.015,
      "kv_cache_tokens_capacity": 32768,
      "prefix_cache_hit_rate": 0.25,
      "finish_reasons": {"stop": 0.90, "length": 0.09, "abort": 0.01},
      "seed": null
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-driven
  namespace: llm-sim
  labels:
    app.kubernetes.io/name: llm-sim
    app.kubernetes.io/part-of: gpu-sim-llm
    app.kubernetes.io/component: driven
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: llm-sim, app.kubernetes.io/component: driven }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-sim
        app.kubernetes.io/part-of: gpu-sim-llm
        app.kubernetes.io/component: driven
      annotations:
        run.ai/simulated-gpu-utilization: "10-20"
    spec:
      # See 20-simulators.yaml: the `llm-sim` Service injects LLM_SIM_PORT into
      # every pod in this namespace. This Deployment shares the same selector and
      # the same script, so it needs the same guard.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sim
          image: python:3.12-slim
          command: ["python3", "/opt/llm-sim/llm_sim.py",
                    "--profile", "/etc/llm-sim/profile.json"]
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: llm-metrics, containerPort: 9401 }
          readinessProbe:
            httpGet: { path: /metrics, port: llm-metrics }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script,  mountPath: /opt/llm-sim, readOnly: true }
            - { name: profile, mountPath: /etc/llm-sim, readOnly: true }
      volumes:
        - name: script
          configMap: { name: llm-sim-script, defaultMode: 0555 }
        - name: profile
          configMap: { name: llm-profile-driven }   # directory mount, never subPath
