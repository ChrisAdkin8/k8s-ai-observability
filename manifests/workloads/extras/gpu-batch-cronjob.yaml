# Recurring batch GPU workload: every 15 min a short job claims a GPU, runs "busy" for
# ~5 min at 70-90% simulated util, then completes — so you see a GPU workload appear,
# load the GPU, and finish (good for utilisation-over-time and lifecycle demos). Opt-in.
#
# Trigger one immediately instead of waiting for the schedule:
#   kubectl create job --from=cronjob/gpu-batch gpu-batch-now -n default
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-batch
  namespace: default
  labels: { app.kubernetes.io/part-of: gpu-sim-workloads }
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120     # GC completed jobs
      backoffLimit: 0
      template:
        metadata:
          labels: { app: gpu-batch, app.kubernetes.io/part-of: gpu-sim-workloads }
          annotations:
            run.ai/simulated-gpu-utilization: "70-90"   # on the POD template
        spec:
          restartPolicy: Never
          containers:
            - name: batch
              image: busybox:1.36
              command: ["sh", "-c", "echo 'GPU batch running'; sleep 300; echo done"]
              resources:
                limits: { nvidia.com/gpu: "1" }
