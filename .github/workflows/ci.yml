# CI — stands up the ENTIRE stack on a runner that has never seen a GPU.
#
# This repo's premise is "no GPU hardware, quota, drivers or model weights required",
# which has a useful consequence: unlike most Kubernetes infra repos, it can prove its
# own claim in CI for free. So this workflow does not lint manifests or dry-run Helm —
# it runs the advertised one-shot path, `task local:up`, end to end, including every
# acceptance check in scripts/verify.sh.
#
# OPTIONAL SECRETS (both, or neither):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN — a free Docker Hub account and a read-only
#   access token. Four images come from Docker Hub (kindest/node, python:3.12-slim,
#   busybox, grafana/grafana); anonymous pulls are rate-limited per-IP and Actions
#   runners share egress IPs, so unauthenticated runs are flakier. The login step is
#   gated on the secrets being present, because pull requests FROM FORKS never receive
#   secrets at all — an ungated login would fail every external contribution and make it
#   look like the contributor's fault.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly drift detection. The stack tracks two upstream Helm charts, a pinned
  # kindest/node image, and vLLM's histogram bucket boundaries and metric set;
  # without this, upstream breakage is discovered by a stranger.
  # NOTE: `schedule` fires only on the default branch, so this trigger cannot be
  # verified before merge — workflow_dispatch runs the same job to prove the code path.
  schedule:
    - cron: '17 4 * * 1'

# Pushing twice should not leave two 20-minute runs racing.
#
# ⚠️ BUT NOT ON main. Superseding a pull-request run costs nothing — the newer commit
# is the one anyone cares about. Superseding a PUSH to main destroys the only record
# that a merged commit was ever verified, and a release tag is pushed at a commit on
# main (docs/releasing.md step 4). Two merges a minute apart would leave the first with
# a cancelled run, and nothing downstream would notice: the ruleset gates the pull
# request, not the tag. So main runs to completion and only branches supersede.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ⚠️ READ-ONLY BY DEFAULT, AND ONE JOB DELIBERATELY WIDENS IT. Every job in this file
# inherits `contents: read` except `drift-notify`, which restates it alongside
# `issues: write` so it can file a drift report. That is the only write scope in CI and
# it is worth naming rather than discovering: job-level permissions REPLACE this default
# rather than extending it, so the widening is visible in exactly one place.
#
# It is reachable only from `schedule` and `workflow_dispatch`, both of which require
# the default branch or write access — a pull request, including one from a fork, cannot
# run that job at all. The alternative was a separate workflow, which buys nothing: the
# same token, the same scope, one more file to keep in step.
permissions:
  contents: read

env:
  # Pinned deliberately: an unpinned toolchain turns someone else's release into a
  # mystery red run on an unrelated commit.
  #   kind    — v0.32.0 ships kindest/node:v1.36.1 as its default, which is what
  #             kind/gpu-sim.yaml pins. ⚠️ THERE ARE THREE PLACES, NOT TWO: the
  #             composite action .github/actions/verify-chart takes a `kind-version`
  #             input, and its default sat two minors behind this pin — building a
  #             v0.32-era node image on a v0.30 binary, which kind/gpu-sim.yaml's own
  #             comment names as a documented way to get a cluster that never becomes
  #             Ready. Both callers now pass this value explicitly and
  #             check-doc-claims.py asserts all three agree, so the coupling is
  #             mechanised rather than remembered.
  #   kubectl — tracks the node image's minor (1.36).
  #   helm    — v3, NOT the v4 line. Helm 4 is a major version this repo has not been
  #             validated against, and CI should exercise what users actually run.
  KIND_VERSION: v0.32.0
  KUBECTL_VERSION: v1.36.3
  HELM_VERSION: v3.21.3
  TASK_VERSION: v3.52.0
  # promtool has no release of its own — it ships inside the Prometheus archive, so
  # this is a Prometheus version. Without the leading v: the git tag carries one and
  # the tarball name does not, and both spellings are needed below.
  PROMETHEUS_VERSION: 3.7.3
  # actionlint lints the workflows themselves, INCLUDING the bash inside every `run:`
  # body, which it hands to shellcheck. That was 763 lines this repo linted with
  # nothing: the `fast` job's shellcheck covers scripts/*.sh and stops there, while
  # codeql.yml's header names that same shellcheck as the gate for the half CodeQL
  # cannot read. The workflows fell between the two claims — and the SIGPIPE bug of
  # iron rule 17 lived in exactly that gap.
  ACTIONLINT_VERSION: 1.7.7
  # ⚠️ A VERSION PIN FIXES A NAME, NOT BYTES. Every tool below arrives as
  # `curl -fsSL <url>`, which trusts whatever the far end serves under that name —
  # so the pins above were, until now, content-unverified. The actions in this file
  # are pinned by commit SHA and tended by Dependabot; these binaries had the weaker
  # half of that guarantee and none of the second. kind/gpu-sim.yaml already says the
  # same thing about the node image ("Append @sha256:... if you want it pinned by
  # content as well as by tag") and nothing had taken it up.
  #
  # Each value is the publisher's own, read from their checksum file on 2026-08-06:
  #   kind        kind-linux-amd64.sha256sum
  #   kubectl     dl.k8s.io/.../kubectl.sha256
  #   helm        helm-v3.21.3-linux-amd64.tar.gz.sha256sum
  #   task        task_checksums.txt
  #   prometheus  sha256sums.txt
  #   actionlint  actionlint_1.7.7_checksums.txt
  # Bump a version and the next run fails on the sum until it is moved with it. That
  # is the intent: a mismatch is either a bad bump or a substituted artefact, and both
  # deserve a red run rather than a silent install.
  KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
  KUBECTL_SHA256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
  HELM_SHA256: 15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0
  TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
  PROMETHEUS_SHA256: fc9e5da126817438cf2820d9a7206c75e3122802ba8d20add3a6219a59ca6913
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  # ---------------------------------------------------------------------------
  # Is there anything here a cluster could possibly test? A docs-only change
  # cannot alter what `task local:up` does — verified: nothing under scripts/,
  # compose/, manifests/ or tests/ READS a .md file, the only mentions are prose
  # in comments. So standing two kind clusters and a compose stack up to prove a
  # typo fix is 13 minutes of runner time and ~13 minutes of a contributor's
  # patience for no signal.
  #
  # Deliberately NOT `paths-ignore:` on the triggers. A ruleset on main requires
  # these checks, and a job that never STARTS leaves its check pending forever —
  # a docs-only PR would be unmergeable. A job that starts and is SKIPPED by an
  # `if:` reports as successful to the ruleset, which is the behaviour we want.
  #
  # `fast` is never gated. It is 8 seconds, and every PR should have at least one
  # check that actually executed rather than a wall of green skips.
  # ---------------------------------------------------------------------------
  changes:
    name: what changed
    # ⚠️ PINNED, NOT `ubuntu-latest` — here and in every job in every workflow. The
    # env block above argues that an unpinned toolchain turns someone else's release
    # into a mystery red run on an unrelated commit, and `ubuntu-latest` was the
    # largest unpinned dependency in this repository: a runner-image migration moves
    # shellcheck, python3, docker, buildx and the preinstalled kubectl at once, on a
    # date nobody here picks. Pinning carries one obligation in the other direction —
    # GitHub deprecates an image roughly a year before removing it, and says so on
    # every run — so this number does have to move, deliberately, about once a year.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # need both endpoints of the comparison

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Anything not a pull_request or push runs the lot: a scheduled or
          # manually dispatched run is asking "does this still work", and the
          # answer must not depend on what the last commit happened to touch.
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: running everything"; exit 0
          fi

          # A new branch, or a force-push, gives an all-zero or unreachable base.
          # Fail OPEN: an unknown diff is treated as a code change. Being wrong in
          # this direction costs 13 minutes; the other way ships untested code.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "base commit unavailable — running everything"; exit 0
          fi

          # ⚠️ THREE DOTS, NOT TWO, and the difference is the whole optimisation.
          # `git diff A B` lists every path where the two TREES differ, so once main
          # gains a code change this branch does not carry, that file counts as
          # "changed here" and a genuinely docs-only pull request stands up two
          # clusters anyway. The staleness of the branch decided the answer rather
          # than its contents. `A...B` diffs against the MERGE BASE, which is the
          # question actually being asked: what does this branch change?
          #
          # It stays fail-open in the same direction — a merge base that cannot be
          # computed makes git exit non-zero, which `set -e` turns into a failed job
          # rather than a quiet "markdown only", and the RUN_STACK gate below now
          # treats a failed `changes` as a code change.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Non-markdown means code. An EMPTY diff also means code, for the same
          # fail-open reason: it should not happen, and if it does we do not know why.
          # ⚠️ WRITTEN TO A FILE RATHER THAN PIPED, and the DIRECTION is the point.
          # `echo "$changed" | grep -qvE` exits at the first non-markdown path, SIGPIPEs
          # echo, and under pipefail returns 141 — which reads as "markdown only" and
          # SKIPS THE CLUSTER JOBS ON A CODE CHANGE. That is the opposite of the
          # fail-open posture stated 12 lines above, and it needs a diff big enough to
          # fill the pipe buffer, so it would strike only the largest changes.
          # sigpipe-ok: no pipe.
          printf '%s\n' "$changed" > /tmp/changed-files.txt
          if [ -z "$changed" ] || grep -qvE '\.md$' /tmp/changed-files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> non-markdown changes present, running everything"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> markdown only, skipping the cluster and compose jobs"
          fi

  # ---------------------------------------------------------------------------
  # Seconds, and no cluster. NOT no network: it fetches promtool and actionlint, two
  # small release archives, both checksummed. The comment claimed otherwise for as long
  # as promtool has been installed here, and adding actionlint made it wronger — worth
  # correcting rather than leaving, because "no network" is exactly the property someone
  # would rely on when deciding this job cannot be flaky. It can, if a release CDN is.
  #
  # Runs in parallel with the slow job so a typo in the most-edited file in the repo
  # does not cost a 20-minute wait.
  # ---------------------------------------------------------------------------
  fast:
    name: selftest + rule tests + shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validates the simulator's Prometheus exposition: histogram bucket
      # monotonicity, +Inf consistency, HELP/TYPE correctness, and that rendering
      # /metrics observes nothing. Standard library only — no install step needed.
      - name: LLM simulator selftest
        run: python3 scripts/llm-sim.py --selftest

      # The compose path's GPU producer against tests/contracts/dcgm-surface.json —
      # the same contract verify.sh check 3b holds the CLUSTER's exporter to. One
      # file, two independent producers: that is what makes it parity rather than
      # self-consistency, and why a fake-gpu-operator chart bump that renames a
      # series or a label can no longer fail the kind path loudly while the compose
      # path drifts in silence.
      #
      # Needs no docker, so the claim is checked in milliseconds on every push
      # instead of only when someone brings the compose stack up.
      - name: Compose GPU producer vs the DCGM surface contract
        run: python3 compose/gpu-metrics-sim.py --selftest

      # Numbers stated in prose, against the code that owns them: dashboard ids vs
      # the catalog README, the emitted-metric / alert / L-check / query /
      # ${datasource} counts vs what the files actually contain. Every check is a
      # correction commit that already happened — the 0.6.0 "Fixed" entry alone
      # corrected SEVEN of these by hand, and the ITL caveat wrong by 2x reached a
      # PUBLISHED board the same way.
      #
      # Its own selftest runs first: the matchers are regexes over prose, so a
      # reworded claim must fail LOUDLY as a dead check rather than quietly stop
      # matching. Needs no cluster, no docker and no network.
      - name: Doc-claim matchers selftest
        run: python3 scripts/check-doc-claims.py --selftest

      - name: Prose claims vs the code they describe
        run: python3 scripts/check-doc-claims.py

      # ⚠️ Cheap, and it has already earned it twice: `tar tzf | head` failed a
      # chart publish on a correct archive, and `echo | grep -qvE` in this file's
      # own changes filter would have skipped the cluster jobs on a large code
      # change. Neither reproduces under zsh, so a laptop will not find them.
      - name: Pipes into an early-exiting consumer
        run: |
          python3 scripts/check-sigpipe.py --selftest
          python3 scripts/check-sigpipe.py

      # ⚠️ The release tooling's own parsing and decisions. It is the script that
      # produced the most bugs in this repo and the last one to get a selftest.
      - name: Release tooling selftest
        run: python3 scripts/chart-build.py --selftest

      # ⚠️ CodeQL CANNOT READ SHELL, and shell is 40% of this repository. This is
      # the gate for the half codeql.yml is blind to. Two of the bugs found on
      # 2026-08-04 were shell, and neither would have been caught there.
      #
      # The whole directory in one invocation: verify.sh sources config.sh, and a
      # name that is an array in one and a string in the other is invisible when
      # they are linted separately. -S warning because the `A && B || C` notes are
      # informational and this repo uses that idiom deliberately.
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      # ⚠️ THE GLOB ABOVE STOPS AT scripts/, AND 763 LINES OF BASH LIVE PAST IT.
      # This workflow, the two publish workflows and the composite action carry 55
      # `run:` blocks between them, and until now the ONLY thing that read any of it
      # was check-sigpipe.py, which covers exactly one class. codeql.yml's header
      # names the shellcheck above as the gate for the half CodeQL cannot read;
      # the workflows' own shell fell between the two claims. The SIGPIPE bug of
      # iron rule 17 lived in that gap, in this file, in the changes filter.
      #
      # actionlint hands every `run:` body to shellcheck, and additionally type-checks
      # the workflow itself: `needs` that name no job, `${{ }}` referencing a context
      # that is not available where it is written, invalid `if:` expressions. The
      # second half is what would have caught the gate bug fixed in this same change.
      #
      # SHELLCHECK_OPTS carries the severity, because actionlint has no flag of its
      # own for it — `-S warning` matches the step above rather than introducing a
      # second standard, and SC2154 is excluded because a `run:` body legitimately
      # reads variables the step's `env:` supplies, which shellcheck cannot see.
      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xz -C "$HOME/.local/bin" -f /tmp/actionlint.tgz actionlint
          chmod +x "$HOME/.local/bin/actionlint"
          actionlint --version

      - name: actionlint (workflow syntax + the bash inside every run:)
        env:
          SHELLCHECK_OPTS: -S warning -e SC2154
        run: actionlint -no-color -oneline -pyflakes=

      # ⚠️ actionlint CANNOT READ A COMPOSITE ACTION, so the step above does not
      # cover .github/actions/. Verified with v1.7.7 on 2026-08-06: pointed at
      # action.yml it reports `"on" section is missing in workflow` and gives up,
      # because it only models workflow files. That leaves this repo's most
      # important verification — the one publish-chart.yml and the `chart-cluster`
      # job SHARE — as the single unlinted shell file in the tree, which is the
      # opposite of what "one implementation, two subjects" is supposed to buy.
      - name: Composite-action shell
        run: |
          python3 scripts/check-action-shell.py --selftest
          python3 scripts/check-action-shell.py

      # The MATCHING RULES of the weekly drift check, against a committed fixture
      # rather than against upstream. The drift job below runs on a schedule and
      # needs network; this needs neither, and it covers the one piece of
      # judgement in that script — the `_total` suffix rule — which fails
      # SILENTLY when it is wrong. A blanket strip reports "in sync" while a name
      # we emit has no upstream counterpart; the real run prints a plausible
      # answer either way, so the rule cannot be tested by running it.
      - name: vLLM drift-check matching rules
        run: python3 scripts/check-vllm-buckets.py --selftest

      # The MATCHING RULES of the weekly ruleset check, against committed fixtures
      # rather than against the live GitHub API — the same split as the line above,
      # and for a sharper reason. `settings-drift` is the job that answers "is main
      # still protected", and its judgement is entirely in which rulesets it counts
      # and whether it looks at `enforcement`. Both fail SILENTLY when wrong: a
      # disabled ruleset still lists its required checks, so the old inline version
      # printed "ok, they agree" over a branch protected by nothing at all.
      #
      # There is no way to test that by running it — the real run prints a plausible
      # answer either way, and the only input that would prove it is a repository
      # setting deliberately broken in a browser.
      - name: Required-checks drift matching rules
        run: python3 scripts/check-required-checks.py --selftest

      # The publish gate's rules, on the same argument one line up and a sharper
      # version of it: that gate runs ONLY on a tag, so its refusing branches — a
      # re-run whose newest attempt failed, a truncated page read, a commit with no
      # run at all — are paths no ordinary run ever touches. A release is the worst
      # possible place to discover one of them is wrong, because the artefact is
      # already immutable by the time anybody looks.
      - name: Publish-gate matching rules
        run: python3 scripts/check-green-ci.py --selftest

      # promtool is the only tool this job installs, and it is worth it: the stack
      # job below can only ever observe the two alerts the shipped workloads happen
      # to drive, and only from the firing side. These tests cover every rule, both
      # sides of every threshold, and the recording-rule arithmetic — in seconds,
      # with no cluster, so a broken threshold fails here rather than 20 minutes in.
      - name: Install promtool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Downloaded to a FILE and summed before it is unpacked, rather than piped
          # straight into tar: a pipe leaves nothing to verify, and verifying after
          # unpacking is verifying something that has already run.
          curl -fsSLo /tmp/prometheus.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prometheus.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/prometheus.tgz "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          mv "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" "$HOME/.local/bin/promtool"
          chmod +x "$HOME/.local/bin/promtool"

      - name: Alert + recording rule tests
        run: ./scripts/rule-tests.sh

      # Syntax only. `shellcheck` would find real bugs rather than just parse errors,
      # but pointing it at the existing scripts surfaces a warning backlog whose triage
      # is a separate piece of work. Deliberately deferred, not overlooked.
      # Note the glob: scripts/llm-sim.py is Python, and `bash -n` reads one file at a
      # time, hence the loop rather than passing the whole glob at once.
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      # The Python equivalent of the loop above, and it closes a real gap: until now
      # the ONLY Python this workflow executed was scripts/llm-sim.py, via its
      # selftest. dashboard-publish.py, check-vllm-buckets.py, gpu-metrics-sim.py and
      # the docs/ scripts could all ship a SyntaxError and go green — and two of them
      # are release tooling, where the first person to find out is whoever is trying
      # to cut a release.
      #
      # py_compile is the parse-only counterpart to `bash -n`; it is not a linter, for
      # the same reason shellcheck is deferred above.
      - name: Python syntax
        run: |
          set -euo pipefail
          # find, not a glob: the files live in scripts/, compose/ and docs/. dist/ is
          # generated and .git/ is not ours.
          files=$(find . -name '*.py' -not -path './.git/*' -not -path './dist/*' | sort)
          test -n "$files"   # an empty list would pass vacuously
          echo "$files"
          # shellcheck disable=SC2086
          python3 -m py_compile $files

  # ---------------------------------------------------------------------------
  # UPSTREAM drift, as opposed to the two jobs either side of it, which only ever
  # check this repo against itself.
  #
  # This is the gap that let the vLLM metric names and bucket boundaries go two
  # releases stale without a single red run: every existing check reads the
  # simulator, and the simulator was consistent with itself. It was consistent
  # with the wrong thing. No self-contained suite can catch that, because the
  # fault is in a relationship to something outside the suite.
  #
  # SCHEDULE AND DISPATCH ONLY, deliberately. An upstream release is not a
  # contributor's fault, and reddening someone's unrelated pull request because
  # vLLM moved a bucket that morning trains people to ignore red. It also needs
  # network egress to raw.githubusercontent.com, which a fork's runner may not
  # have. Weekly is the right cadence: bucket drift is a correctness bug, but
  # never an urgent one.
  #
  # It watches the metric SET as well as the bucket boundaries. A name we emit
  # that upstream has dropped is the same failure one level up — a panel that
  # goes blank against a real deployment while every test here stays green — and
  # it is the half that actually happened. The reverse direction, upstream
  # declaring something we do not emit, is printed as a gap and exits 0.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The OTHER half of the required-check coupling, and the half that cannot run
  # offline. .github/required-checks.txt records what the `main` ruleset requires;
  # check-doc-claims.py asserts every line of it is a name ci.yml can produce, on
  # every run. That catches a rename in the pull request that made it.
  #
  # It cannot catch the reverse: someone editing the ruleset in the browser. The
  # ruleset is repository SETTINGS, versioned by nothing, and reading it needs the
  # network — so that check lives here, weekly, rather than in the offline gate.
  #
  # ⚠️ NO CREDENTIALS AND NO EXTRA PERMISSIONS. The rulesets endpoint is readable
  # anonymously for a public repository (verified 2026-08-04), so this needs no
  # token, which also means it cannot fail for a fork the way a secret-gated step
  # would. If this repo ever goes private, this step needs a token and this
  # comment is the reason it stopped working.
  # ---------------------------------------------------------------------------
  settings-drift:
    name: branch ruleset vs required-checks.txt
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ MOVED OUT OF THIS FILE, and the move is the fix. Forty lines of inline
      # python here could not be tested, could not be linted, and did not do what
      # the comment above it claimed: it said "find the ruleset targeting main,
      # named lookup rather than a hardcoded id" and then unioned the required
      # checks of EVERY branch-target ruleset, with no name filter and no
      # `conditions.ref_name` filter. Since /rulesets defaults to
      # includes_parents=true, an organisation-level ruleset would have been folded
      # in and reported as "the ruleset requires checks the repo does not record"
      # against a perfectly correct configuration.
      #
      # Worse in the other direction: it never read `enforcement`. A ruleset set to
      # `disabled` or `evaluate` still lists its required_status_checks, so main
      # could have been protected by nothing while this job printed that everything
      # agreed — the single failure it exists to detect.
      #
      # The script is stdlib-only and carries a --selftest over committed fixtures,
      # which `fast` runs offline on every push. Same split as check-vllm-buckets.py:
      # the judgement is unit-tested, the network half runs weekly.
      - name: The ruleset requires exactly what the repo says it does
        run: python3 scripts/check-required-checks.py

  upstream-drift:
    # ⚠️ THE NAME COVERS BOTH STEPS. It said "vLLM upstream drift" while the job also
    # compared every pinned tool checksum against its publisher — so a checksum failure
    # arrived under a heading that mentioned neither checksums nor tools, which is a
    # reader's first and worst clue about what broke. The job KEY stays `upstream-drift`
    # because `drift-notify` names it in `needs:` and CONTRIBUTING.md lists it.
    name: weekly upstream drift (vLLM + tool pins)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exits 1 on drift and 2 when it could not check at all — the second is
      # reported as its own thing rather than silently passing, because "we did
      # not look" and "we looked and it was fine" are not the same result.
      - name: vLLM bucket boundaries and metric set
        run: python3 scripts/check-vllm-buckets.py

      # ⚠️ THE OTHER HALF OF THE CHECKSUM PINS, and the half that cannot run offline.
      # check-doc-claims.py asserts the sums written in two workflows AGREE WITH EACH
      # OTHER; nothing asserted they still describe the artefact the pinned URL serves.
      # A bumped version beside a stale sum fails much later, at `sha256sum -c`, with a
      # message that reads like a substituted artefact rather than a forgotten line.
      #
      # It also catches the case worth having a weekly job for at all: a published
      # release re-cut under the same tag. That is rare and it is exactly the event a
      # content pin exists to detect, so it should not wait for someone's next bump.
      #
      # Compared against each publisher's OWN checksum file, which is why this proves
      # "the pin still matches what is served" and not "the bytes are trustworthy" —
      # the committed constants are what carry that second claim.
      - name: The pinned checksums still match what the publishers serve
        run: |
          set -euo pipefail
          rc=0
          cmp_sum() {  # $1 label  $2 sums-url  $3 filename-key  $4 pinned
            curl -fsSL "$2" -o /tmp/sums.txt || {
              echo "  ??  $1: could not fetch $2"; rc=1; return; }
            # ⚠️ ONE awk OVER A FILE, NOT `grep | awk | head -1`. The first version of
            # this step was written with that pipeline and check-sigpipe.py caught it
            # before it ever ran: `head` exits at the first line, SIGPIPEs awk, and
            # under `set -o pipefail` the substitution returns 141 — so `set -e` kills
            # the step on the FIRST tool checked. awk reading a file exits early with
            # nobody upstream to signal. The leading `*` is the binary marker some
            # publishers emit before the filename.
            got=$(awk -v k="$3" '{ n=$2; sub(/^\*/, "", n); if (n == k) { print $1; exit } }' /tmp/sums.txt)
            # A bare-hash file — kubectl's .sha256 — has no filename column at all.
            [ -n "$got" ] || got=$(tr -d '[:space:]' < /tmp/sums.txt)
            if [ "$got" = "$4" ]; then
              echo "  ok  $1"
            else
              echo "::error title=Pinned checksum no longer matches::$1: the publisher now serves $got, ci.yml pins $4. Either the version was bumped without moving the sum, or the release was re-cut under the same tag."
              rc=1
            fi
          }
          cmp_sum kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum" \
            "kind-linux-amd64" "$KIND_SHA256"
          cmp_sum kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" \
            "kubectl" "$KUBECTL_SHA256"
          cmp_sum helm \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" \
            "helm-${HELM_VERSION}-linux-amd64.tar.gz" "$HELM_SHA256"
          cmp_sum task \
            "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_checksums.txt" \
            "task_linux_amd64.tar.gz" "$TASK_SHA256"
          cmp_sum prometheus \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/sha256sums.txt" \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" "$PROMETHEUS_SHA256"
          cmp_sum actionlint \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          exit $rc

  # ---------------------------------------------------------------------------
  # ⚠️ A RED RUN NOBODY IS TOLD ABOUT IS A CHECK THAT NEVER FAILS — iron rule 18,
  # applied to the two jobs above. Both run only on `schedule`, which fires only on
  # the default branch, so neither has a pull request to redden and neither blocks
  # anything. Their entire output was a red square on the Actions tab and one
  # notification email to whoever owns the repository. `upstream_drift.yml` exists
  # as an ISSUE TEMPLATE, which says plainly that an issue is the intended
  # destination; nothing was carrying the finding there.
  #
  # ⚠️ ONE JOB FOR BOTH, NOT A STEP IN EACH. Two copies of the de-duplication logic
  # would be two chances to get it wrong, and the failure mode of getting it wrong
  # is a new issue every Monday forever, which trains people to ignore the label.
  #
  # DE-DUPLICATED ON THE LABEL, NOT THE TITLE. A title carries the run id, so
  # matching on it would open a fresh issue weekly for a drift nobody has got to
  # yet. An open `upstream-drift` issue means the finding is already on the board.
  # ---------------------------------------------------------------------------
  drift-notify:
    name: open an issue when a weekly check goes red
    needs: [upstream-drift, settings-drift]
    # `!cancelled()` rather than `always()`: a cancelled weekly run has not established
    # that anything drifted, and filing an issue about it would be noise on the label
    # this job's de-duplication depends on staying meaningful.
    if: ${{ !cancelled() && (needs.upstream-drift.result == 'failure' || needs.settings-drift.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow default rather than extending it,
    # so `contents: read` is restated alongside the write scope — the same trap
    # publish-image.yml documents, where the failure reads as a bad credential.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: File one, if there is not one open already
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM: ${{ needs.upstream-drift.result }}
          SETTINGS: ${{ needs.settings-drift.result }}
        run: |
          set -euo pipefail
          # ⚠️ CREATED FIRST, BECAUSE IT DOES NOT EXIST YET. The issue TEMPLATE
          # applies `bug`, and there is no `upstream-drift` label in this repository
          # — `gh issue create --label` on a missing label is a hard error, so the
          # first red weekly run would have failed here instead of filing anything.
          # `bug` is the wrong thing to de-duplicate on anyway: any open bug would
          # suppress a drift report. Idempotent, so this also works in a fork.
          gh label create upstream-drift \
            --description "A pinned upstream, or the branch ruleset, has moved under this repo" \
            --color B60205 2>/dev/null || true
          # Written to a file rather than piped, for the reason the changes filter
          # states: a consumer that exits early SIGPIPEs the producer and pipefail
          # promotes 141 to the status of the step.
          # sigpipe-ok: no pipe.
          gh issue list --label upstream-drift --state open --json number > /tmp/open.json
          if [ "$(python3 -c 'import json;print(len(json.load(open("/tmp/open.json"))))')" != "0" ]; then
            echo "::notice title=Drift already tracked::An open upstream-drift issue exists, so no new one was filed. $RUN_URL"
            exit 0
          fi
          {
            echo "A weekly drift check went red on \`main\`."
            echo
            echo "| check | result |"
            echo "|--|--|"
            echo "| weekly upstream drift (vLLM + tool pins) | \`$UPSTREAM\` |"
            echo "| branch ruleset vs required-checks.txt | \`$SETTINGS\` |"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Neither check fixes anything — both detect, and a human decides."
            echo "See \`scripts/check-vllm-buckets.py\` and \`scripts/check-required-checks.py\`"
            echo "for what each one compares and why."
          } > /tmp/body.md
          gh issue create \
            --title "Weekly drift check failed (run ${GITHUB_RUN_ID})" \
            --label upstream-drift \
            --body-file /tmp/body.md

  # ---------------------------------------------------------------------------
  # The path with no Kubernetes at all — and the FIRST command in the README, which
  # until now had no CI coverage whatsoever. Docker only: no kind, no helm, no task.
  #
  # It is not a cheaper duplicate of the `stack` job. It exercises a different set of
  # artefacts reading the same sources: Prometheus loading the rules unwrapped out of
  # manifests/alerts/ by scripts/extract.sh, Grafana provisioning the boards straight
  # off disk instead of through the sidecar, and the compose-only GPU producer. A
  # break in extract.sh, in the provisioning files, or in either board's JSON shows up
  # here and nowhere else.
  # ---------------------------------------------------------------------------
  compose:
    name: compose stack (no Kubernetes)
    # Gated for the same reason as `stack`, on the same output: the compose path reads
    # the same dashboards, rules, simulator and profiles, so a markdown-only change
    # cannot move it either. Cheaper to run (~1 min) but the signal is identically zero.
    # `fast` too: it is 9-12s and covers the selftests, doc-claims, the rule tests
    # and both syntax passes. When it is red this job is proving something already
    # known to be broken. Safe as a plain `needs:` here, unlike the matrix `stack`
    # job — a skipped NON-matrix job still reports under its own name.
    # ⚠️ `always()`, AND THE POLARITY OF THE SECOND TEST IS THE POINT. This was a bare
    # `if: needs.changes.outputs.code == 'true'`, which carries an implicit `success()`
    # over both dependencies — so a `changes` job that FAILED (checkout flake, a
    # five-minute timeout on `fetch-depth: 0`) skipped this job, and GitHub reports a
    # skipped job to a ruleset as passed. All four required checks went green with
    # nothing stood up. The filter SCRIPT is carefully fail-open ("being wrong in this
    # direction costs 13 minutes; the other way ships untested code"); the job wrapped
    # around it was fail-into-green, which is the posture this repo writes assertions
    # against. `!= 'false'` treats an absent output — the only thing a failed `changes`
    # can produce — as a code change.
    needs: [changes, fast]
    if: ${{ !cancelled() && needs.fast.result == 'success' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    # Generous against a measured ~1 minute. Nothing here waits on a Helm release; the
    # budget is image pulls plus the readiness poll below.
    timeout-minutes: 10
    env:
      # Same collapse-to-boolean as the stack job: the `secrets` context is not
      # available in a step-level `if`.
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # Five of the six images here come from Docker Hub, so the login below matters
      # more for this job than for any other.
      PROMETHEUS_PORT: 9090
      GRAFANA_PORT: 3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gated exactly as the stack job's is — fork PRs never receive secrets, and an
      # ungated login fails every external contribution.
      - name: Log in to Docker Hub (skipped without secrets)
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker compose up
        id: up
        working-directory: compose
        run: docker compose up -d

      # No healthchecks in compose.yaml, so readiness is polled rather than waited on.
      # Bounded: a stack that never comes up must fail rather than hang until the cap.
      #
      # 180s, raised from 60s after a real miss. The two do NOT come up together:
      # Prometheus was serving at 19:20:15 while Grafana was still running its first-run
      # SQLite migrations at 19:21:15 — a full minute behind, on a healthy stack with
      # every container Up and nothing in the logs. 60s was tuned to the fast path and
      # a loaded runner walked straight past it.
      #
      # Raising a poll ceiling costs nothing on a healthy run, because the loop exits
      # the second both endpoints answer. It stays bounded: a stack that genuinely
      # never comes up still fails rather than hanging.
      - name: Wait for Prometheus and Grafana
        run: |
          set -euo pipefail
          # `if`, not `a || b && c`: under `set -e` a failing curl at the end of such a
          # chain is the line's exit status and would abort the step on the first poll,
          # before anything has had a chance to come up. A failed condition inside `if`
          # is not an error.
          prom="" graf=""
          for i in $(seq 1 180); do
            if [ -z "$prom" ] && curl -sf "http://localhost:${PROMETHEUS_PORT}/-/ready" >/dev/null; then
              prom="$i"
            fi
            if [ -z "$graf" ] && curl -sf "http://localhost:${GRAFANA_PORT}/api/health" >/dev/null; then
              graf="$i"
            fi
            if [ -n "$prom" ] && [ -n "$graf" ]; then
              echo "ready after ${i}s (prometheus ${prom}s, grafana ${graf}s)"; exit 0
            fi
            sleep 1
          done
          # Name WHICH one, so the next failure is diagnosable from the summary rather
          # than by downloading the log bundle — that cost a round trip this time.
          echo "not ready after 180s: prometheus=${prom:-NEVER} grafana=${graf:-NEVER}" >&2
          exit 1

      # ⚠️ ASSERTED THROUGH PROMETHEUS, NOT BY CURLING THE SIMULATORS. Only Prometheus
      # and Grafana publish ports (compose.yaml) — the three simulator containers
      # publish none, so `curl` from the runner cannot reach them at all. Querying
      # instead is not a workaround, it is the better assertion: it proves the scrape
      # works, which curling raw exposition would not.
      #
      # One series per producer, and the rate() on the LLM side is deliberate: a
      # counter that exists and never moves is the failure a presence check misses.
      - name: Assert both producers through Prometheus
        run: |
          set -euo pipefail
          q() {
            curl -sfG "http://localhost:${PROMETHEUS_PORT}/api/v1/query" \
              --data-urlencode "query=$1" \
              | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("data",{}).get("result",[])))'
          }
          # The rules evaluate every 30s and rate() needs two samples in the window,
          # so give the first evaluations time to land before asserting.
          for _ in $(seq 1 40); do
            gpu=$(q 'DCGM_FI_DEV_GPU_UTIL' || echo 0)
            llm=$(q 'rate(vllm:generation_tokens_total[1m]) > 0' || echo 0)
            [ "$gpu" -gt 0 ] && [ "$llm" -gt 0 ] && break
            sleep 3
          done
          echo "DCGM_FI_DEV_GPU_UTIL series: $gpu"
          echo "advancing vllm token counters: $llm"
          [ "$gpu" -gt 0 ] || { echo "the GPU producer is not being scraped" >&2; exit 1; }
          [ "$llm" -gt 0 ] || { echo "the LLM producers are not advancing" >&2; exit 1; }

          # The derived series prove Prometheus really loaded the rules that
          # scripts/extract.sh unwrapped out of manifests/alerts/. Without them the
          # GPU board's lower half is blank — the same coupling verify.sh check 4c
          # asserts on the cluster.
          #
          # Polled, for the same reason 4c is, and this leg learned it the hard way:
          # the loop above breaks the moment BOTH PRODUCERS are live, which on a fast
          # runner is ~15s. A recording rule does not exist until its next evaluation
          # (30s), so asserting immediately failed with DCGM_FI_DEV_GPU_TEMP at 0
          # series while its input sat at 8. The quicker the producers come up, the
          # more certainly the unpolled check loses the race — the failure mode gets
          # WORSE as the machine gets faster, which is why it read as a real fault.
          #
          # 120s, matching DCGM_POLL_ATTEMPTS in verify.sh. Bounded, not unbounded:
          # rules that were never extracted never appear, and that must fail.
          for m in DCGM_FI_DEV_GPU_TEMP DCGM_FI_DEV_POWER_USAGE llm:ttft:p95_5m; do
            n=0
            for _ in $(seq 1 40); do
              n=$(q "$m" || echo 0)
              [ "$n" -gt 0 ] && break
              sleep 3
            done
            echo "derived $m: $n series"
            [ "$n" -gt 0 ] || { echo "$m empty after 120s — were the rules extracted and loaded?" >&2; exit 1; }
          done

      - name: Assert every scrape target is up
        run: |
          set -euo pipefail
          curl -sf "http://localhost:${PROMETHEUS_PORT}/api/v1/targets" -o /tmp/targets.json
          # The heredoc body is indented to the block scalar's own margin: YAML strips
          # that prefix, so python receives it at column 0. Un-indenting it here would
          # end the block instead.
          python3 - <<'PY'
          import json, sys
          active = json.load(open("/tmp/targets.json"))["data"]["activeTargets"]
          bad = [(t["labels"].get("job"), t["scrapeUrl"], t["health"], t.get("lastError", ""))
                 for t in active if t["health"] != "up"]
          print(f"{len(active)} active target(s), {len(bad)} not up")
          for job, url, health, err in bad:
              print(f"  {job} {url} {health} {err}")
          # No active targets at all is a failure too: an empty list would otherwise
          # satisfy "nothing is down".
          sys.exit(1 if (bad or not active) else 0)
          PY

      # Mirrors verify.sh check 4b / L5: fetch each board BY UID over an
      # UNAUTHENTICATED request. That is the check which catches a dashboard that
      # exists on disk but was never actually loaded — here by Grafana provisioning
      # rather than by the sidecar, which is the difference this job exists to cover.
      - name: Assert both boards anonymously by uid
        run: |
          set -euo pipefail
          for uid in gpu-sim-dcgm llm-sim-overview; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://localhost:${GRAFANA_PORT}/api/dashboards/uid/${uid}")
            echo "$uid -> $code"
            case "$code" in
              200) ;;
              401|403) echo "anonymous Viewer is not enabled (compose.yaml)" >&2; exit 1 ;;
              404) echo "no board with uid $uid — provisioning did not load it" >&2; exit 1 ;;
              *)   echo "Grafana unreachable (http $code)" >&2; exit 1 ;;
            esac
          done

      # always(), for the same reason the stack job's diagnostics are: a cancelled or
      # timed-out run is the one whose logs you need. Guarded on `up` so a run
      # superseded before the stack existed does not upload an empty bundle.
      #
      # ⚠️ AND NOT ON SUCCESS — BUT WHOSE SUCCESS. This read
      # `steps.up.outcome != 'success'`, which is the outcome of `docker compose up -d`,
      # step 2 of 6. That step succeeds essentially always, so the condition was false
      # on every run where anything downstream broke: the readiness poll timing out,
      # a producer not being scraped, a target down, a board 404. In other words the
      # bundle was collected ONLY when compose itself failed to start, and never on
      # any failure this job exists to catch. It read as correct because the STACK
      # job's identical-looking guard IS correct — there `up` is `task local:up`,
      # which is cluster + install + verify, the whole job.
      #
      # `job.status` is the thing actually meant: not-success covers failure,
      # cancellation and timeout, which is why this is still not `failure()`. The `up`
      # guard stays, so a run superseded before the stack existed uploads nothing.
      - name: Collect compose logs
        if: always() && steps.up.outcome != 'skipped' && job.status != 'success'
        working-directory: compose
        run: |
          mkdir -p /tmp/compose-diag
          docker compose ps -a       > /tmp/compose-diag/ps.txt   2>&1 || true
          docker compose logs --no-color --tail=400 \
                                     > /tmp/compose-diag/logs.txt 2>&1 || true
          # The extracted rules and profiles: if `generate` failed, everything
          # downstream is blank and this is where it shows.
          ls -laR .generated         > /tmp/compose-diag/generated.txt 2>&1 || true
          cp /tmp/targets.json /tmp/compose-diag/ 2>/dev/null || true

      - name: Upload compose diagnostics
        if: always() && steps.up.outcome != 'skipped' && job.status != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compose-diag
          retention-days: 14
          if-no-files-found: warn

      # -v, so the extracted rules and Prometheus' TSDB do not survive into a rerun on
      # a reused runner and make a broken `generate` look like it worked.
      - name: docker compose down
        if: always()
        working-directory: compose
        run: docker compose down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # The Helm chart: lint, render both ways, and — the part that matters — prove
  # the render-time assertions FIRE on deliberately broken values.
  #
  # ⚠️ A LINT-AND-RENDER JOB WOULD BE NEARLY WORTHLESS HERE. The chart's whole
  # claim is that it reproduces install.sh's safety net, whose entire purpose is
  # catching inputs that would otherwise produce a GREEN INSTALL with something
  # silently wrong. An assertion that has quietly stopped firing looks exactly
  # like an assertion that passes. So each one is driven to its failure here,
  # and a broken input that RENDERS SUCCESSFULLY fails this job.
  #
  # ⚠️ THE `fast` JOB HAS NO HELM — it installs promtool and nothing else. This
  # is its own job with the version pinned the same way the stack job pins it:
  # v3, NOT the v4 line, because Helm 4 is a major version this repo has not
  # been validated against and CI should exercise what users actually run.
  # Leaving it to whatever Helm happens to be on the runner is how a green run
  # stops meaning anything.
  # ---------------------------------------------------------------------------
  chart:
    name: helm chart (lint, render, assertions fire)
    # `fast` too, and `always()` with the inverted second test, for the reasons the
    # `compose` job states at length — a failed `changes` job must run this, not skip it.
    needs: [changes, fast]
    if: ${{ !cancelled() && needs.fast.result == 'success' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build cross-checks Chart.yaml's appVersion against the repo's
          # latest tag, and `git describe` finds nothing in a shallow clone —
          # which would silently skip the check rather than fail it.
          fetch-depth: 0

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/helm.tgz linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          chmod +x "$HOME/.local/bin/helm"
          helm version --short

      # Assembles into gitignored dist/ from the canonical files in manifests/.
      # This is also where the dashboard uid/filename contract and the rule
      # extraction are checked, so a broken board fails before Helm sees it.
      - name: task chart (assemble into dist/)
        run: python3 scripts/chart-build.py

      - name: helm lint
        run: helm lint dist/charts/k8s-ai-observability

      # Both ways round. `=false` is the BYO case the chart exists for; `=true`
      # additionally renders the subchart's own templates, which is a different
      # code path and the one a values typo in the pass-through block breaks.
      - name: helm template, both stack settings
        run: |
          set -euo pipefail
          for v in false true; do
            echo "--- kubePrometheusStack.enabled=$v"
            helm template rig dist/charts/k8s-ai-observability \
              --set kubePrometheusStack.enabled=$v > "/tmp/render-$v.yaml"
            echo "    $(grep -c '^kind:' "/tmp/render-$v.yaml") objects"
          done
          # A render that succeeds and produces nothing would satisfy the step
          # above. Assert the objects this chart is FOR are actually in it.
          for kind in PrometheusRule ServiceMonitor ConfigMap Deployment Service; do
            grep -q "^kind: $kind$" /tmp/render-false.yaml \
              || { echo "no $kind in the default render" >&2; exit 1; }
          done

      # THE POINT OF THIS JOB. Every render-time assertion, driven to its
      # failure. A broken input that renders successfully is the regression to
      # catch — it means install.sh's safety net has a hole on the chart path
      # that nothing else would report.
      - name: The render-time assertions fire on broken values
        run: |
          set -uo pipefail
          C=dist/charts/k8s-ai-observability
          rc=0
          must_fail() {
            desc="$1"; shift
            if helm template rig "$C" "$@" >/dev/null 2>&1; then
              echo "  FAIL  rendered successfully but should NOT have: $desc"
              rc=1
            else
              echo "  ok    fires: $desc"
            fi
          }
          # ---- assert_llm_contract, ported -----------------------------------
          must_fail "two tenants sharing a model_name" \
            --set llm.saturated.modelName=sim-llama-3-8b-steady
          # ---- the capacity arithmetic (no install.sh equivalent — the script
          #      path's profiles are static files, so this hazard is new here) --
          must_fail "steady tenant above modelled capacity" \
            --set llm.steady.arrivalRateRps=9
          must_fail "saturated tenant below modelled capacity" \
            --set llm.saturated.arrivalRateRps=1.0
          must_fail "maxInFlight below maxConcurrency" \
            --set llm.profile.maxInFlight=4
          must_fail "prefix cache hit rate given as a percentage" \
            --set llm.steady.prefixCacheHitRate=35
          # ---- the two silent selectors --------------------------------------
          must_fail "empty releaseLabel" --set releaseLabel=
          must_fail "empty grafana.dashboardLabel" --set grafana.dashboardLabel=
          # ---- assert_gpu_contract, ported (the three-way naming invariant) ---
          must_fail "node-pool label key disagrees with the subchart's" \
            --set nodePoolLabelKey=nvidia.com/something-else
          must_fail "nodePoolName is not one of the topology pools" \
            --set nodePoolName=nonexistent

          # ---- assert_dashboard_contract, ported -----------------------------
          # Both halves, and they need DIFFERENT messages: an unparseable board
          # once reported as a uid mismatch against "<nil>", which sends the
          # reader to rename a file when the real fault is a bad edit.
          mv "$C/files/dashboards/llm-sim-overview.json" "$C/files/dashboards/renamed.json"
          must_fail "dashboard filename disagrees with the uid inside it"
          mv "$C/files/dashboards/renamed.json" "$C/files/dashboards/llm-sim-overview.json"

          echo 'not json {' > "$C/files/dashboards/broken.json"
          must_fail "a board that does not parse as JSON"
          rm "$C/files/dashboards/broken.json"

          echo '{"title":"no uid here"}' > "$C/files/dashboards/nouid.json"
          must_fail "valid JSON with no top-level uid"
          rm "$C/files/dashboards/nouid.json"

          # ---- the build step is not silently doing nothing ------------------
          rm -rf "$C/files/rules"
          must_fail "no rule files (the chart was not assembled)"

          # And the clean chart must STILL render, or every `ok` above could be
          # explained by the chart being broken outright.
          python3 scripts/chart-build.py >/dev/null
          helm template rig "$C" >/dev/null \
            || { echo "  FAIL  the clean chart no longer renders"; rc=1; }
          echo "  ok    the clean chart still renders"
          exit $rc

      # values.schema.json is a second layer over the same inputs, and it can
      # rot independently of the assertions — a schema that accepts anything
      # passes every test above. Driven to a type failure specifically.
      - name: values.schema.json rejects a wrong TYPE
        run: |
          set -uo pipefail
          C=dist/charts/k8s-ai-observability
          rc=0
          for bad in "llm.profile.maxConcurrency=notanumber" "llm.steady.prefixCacheHitRate=2.5"; do
            if helm template rig "$C" --set "$bad" >/dev/null 2>&1; then
              echo "  FAIL  schema accepted $bad"; rc=1
            else
              echo "  ok    schema rejects $bad"
            fi
          done
          exit $rc

      # ⚠️ The rule the whole build step exists to keep. If a dashboard, a rule
      # file or the simulator ever appears outside the one path that owns it, the
      # single-source-of-truth constraint has been quietly abandoned and
      # assembling into dist/ is doing nothing.
      #
      # ⚠️ THIS WAS INLINE BASH UNTIL 2026-08-07, AND THAT IS WHY IT WENT RED
      # UNNOTICED. It needs no cluster, no cloud and no Docker — `task preflight`'s
      # entire scope — so a local run said green while `main` was red for a day.
      # The pattern, the allowlist and the reasoning now live in the script, with a
      # `--selftest`, and `task preflight` runs the same code this does.
      - name: No second committed copy of any canonical file
        run: |
          echo "tracked files under charts/:"
          git ls-files charts/ | sed 's/^/  /'
          python3 scripts/check-second-copy.py

  # ---------------------------------------------------------------------------
  # The simulator image — BUILT for both architectures, RUN on one.
  #
  # ⚠️ A BUILD-ONLY JOB WOULD PROVE THE DOCKERFILE PARSES AND NOTHING ELSE. The
  # failures worth catching here are runtime ones: a COPY that lands the script
  # somewhere the ENTRYPOINT does not look, a non-root user that cannot read it,
  # a base-image Python that the stdlib-only claim turns out to be wrong about.
  # So this runs the image and scrapes it.
  #
  # ⚠️ WHICH ARCHITECTURE IS ACTUALLY EXECUTED, stated plainly rather than left
  # to be inferred. `ubuntu-latest` is amd64, so the arm64 image CANNOT be run
  # natively here. Two options were available and this job takes the second:
  #
  #   (a) docker/setup-qemu-action and run arm64 under emulation. Genuinely
  #       exercises the arm64 layer, but is slower and adds QEMU's own failure
  #       modes to the surface being tested.
  #   (b) build both, smoke-test the runner's native arch. Honest and cheap.
  #
  # (b) is defensible HERE SPECIFICALLY because the two images differ only in
  # base-image layers — the payload is one architecture-independent .py file
  # with no compiled extension and no wheel — so an arm64-only runtime failure
  # would have to originate inside python:3.12-slim itself. If the image ever
  # grows a dependency with native code, this reasoning expires and (a) is what
  # replaces it.
  #
  # Gated exactly as the compose job is, and for the same reason: this reads
  # scripts/llm-sim.py, so a markdown-only change cannot move it.
  # ---------------------------------------------------------------------------
  image:
    name: simulator image (build both arches, smoke-test amd64)
    # `fast` too, and `always()` with the inverted second test, for the reasons the
    # `compose` job states at length — a failed `changes` job must run this, not skip it.
    needs: [changes, fast]
    if: ${{ !cancelled() && needs.fast.result == 'success' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python:3.12-slim is a Docker Hub image, so the same rate-limit reasoning
      # as the other jobs applies. Gated on the secrets existing — fork PRs never
      # receive them, and an ungated login fails every external contribution.
      - name: Log in to Docker Hub (skipped without secrets)
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⚠️ REQUIRED FOR THE arm64 HALF, and its absence here was an asymmetry with
      # publish-image.yml, which sets QEMU up for the identical multi-arch build of
      # the identical Dockerfile. That Dockerfile has a `RUN useradd`, so the arm64
      # layer EXECUTES arm64 binaries and needs binfmt emulation. Without this step
      # the build depended on whatever binfmt handlers the runner image happens to
      # register — an undeclared dependency, and exactly what pinning `ubuntu-24.04`
      # above is meant to stop this file from having. The block below argues that
      # option (a) "adds QEMU's own failure modes"; that argument applies to RUNNING
      # arm64 under emulation, which this job still does not do. Building it always
      # needed QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      # Both platforms, so a Dockerfile change that only works on amd64 fails
      # here rather than at publish time. --load cannot take a multi-platform
      # result, so this build stays in the cache and the single-arch load below
      # is what produces something runnable.
      - name: Build linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t vllm-metrics-sim:ci .

      - name: Load the amd64 image into the runner's docker
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            -t vllm-metrics-sim:ci .

      # THE SMOKE TEST. Run it, scrape it, and assert the surface — not merely
      # that the container started. A simulator that serves an empty body, or
      # exposition with no HELP lines, would satisfy "it ran".
      - name: Run the image and scrape /metrics
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 9401:9401 vllm-metrics-sim:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          # Bounded poll, not a fixed sleep: a container that never serves must
          # fail rather than pass on a lucky timing.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9401/metrics -o /tmp/scrape.txt; then
              echo "serving after ${i}s"; break
            fi
            sleep 1
          done
          test -s /tmp/scrape.txt || { echo "no scrape after 30s" >&2; exit 1; }

          # One series and one HELP line, per the acceptance criterion — plus the
          # three phase histograms specifically, since they are what this release
          # adds and a stale image would serve a perfectly valid older surface.
          grep -q '^# HELP vllm:num_requests_running ' /tmp/scrape.txt
          grep -q '^vllm:num_requests_running{'        /tmp/scrape.txt
          for m in prefill decode inference; do
            grep -q "^# HELP vllm:request_${m}_time_seconds " /tmp/scrape.txt
          done

          # No `source` label on any vllm: series — the same invariant --selftest
          # holds, asserted here against what the IMAGE actually serves.
          # ⚠️ ONE grep, NOT `grep | grep -q`. Under pipefail the second grep exits at
          # the first match, SIGPIPEs the first, and the pipeline returns 141 — so the
          # `if` was false EXACTLY WHEN A VIOLATION WAS PRESENT. This assertion could
          # only ever fail open. sigpipe-ok: no pipe.
          if grep -qE '^vllm:.*source="' /tmp/scrape.txt; then
            echo "a vllm: series carries a source label" >&2; exit 1
          fi
          echo "scraped $(grep -c '^vllm:' /tmp/scrape.txt) vllm: sample lines"

      # LLM_SIM_LISTEN_PORT is the documented override and LLM_SIM_PORT is the
      # name that must NOT work — kubelet injects the latter for every Service in
      # the namespace, and reading it meant int() got a URL and every pod died at
      # startup. Both halves asserted, because the docs claim both.
      - name: The port override is LLM_SIM_LISTEN_PORT, and LLM_SIM_PORT is ignored
        run: |
          set -euo pipefail
          cid=$(docker run -d -e LLM_SIM_LISTEN_PORT=9999 -p 9999:9999 vllm-metrics-sim:ci)
          for _ in $(seq 1 30); do curl -sf http://localhost:9999/metrics -o /dev/null && break; sleep 1; done
          curl -sf http://localhost:9999/metrics -o /dev/null \
            || { echo "LLM_SIM_LISTEN_PORT=9999 did not move the listener" >&2; docker logs "$cid"; exit 1; }
          docker rm -f "$cid" >/dev/null

          # Must be IGNORED rather than fatal: a pod in a namespace with an
          # llm-sim Service receives this, and crashing on it is the original bug.
          cid=$(docker run -d -e LLM_SIM_PORT=tcp://10.0.0.1:9401 -p 9402:9401 vllm-metrics-sim:ci)
          for _ in $(seq 1 30); do curl -sf http://localhost:9402/metrics -o /dev/null && break; sleep 1; done
          curl -sf http://localhost:9402/metrics -o /dev/null \
            || { echo "LLM_SIM_PORT was not ignored — it must not be read" >&2; docker logs "$cid"; exit 1; }
          docker rm -f "$cid" >/dev/null

      # The image must be DERIVED from scripts/llm-sim.py, never a vendored copy.
      # A drifted copy of the simulator would be undetectable from outside, which
      # is the property tests/contracts/ guarantees for the DCGM surface. This is
      # the automatic failure that keeps that true.
      - name: No second copy of the simulator exists in the tree
        run: |
          set -euo pipefail
          copies=$(git ls-files | grep -E '(^|/)llm[-_]sim\.py$' || true)
          echo "tracked simulator files:"; echo "$copies" | sed 's/^/  /'
          [ "$copies" = "scripts/llm-sim.py" ] \
            || { echo "expected exactly scripts/llm-sim.py; the image must COPY it, not vendor it" >&2; exit 1; }

          # And what the image serves must be that file, byte for byte.
          docker run --rm --entrypoint sha256sum vllm-metrics-sim:ci /app/llm_sim.py | cut -d' ' -f1 > /tmp/in-image
          sha256sum scripts/llm-sim.py | cut -d' ' -f1 > /tmp/in-repo
          diff /tmp/in-image /tmp/in-repo \
            || { echo "the image's llm_sim.py differs from scripts/llm-sim.py" >&2; exit 1; }
          echo "image payload matches scripts/llm-sim.py ($(cat /tmp/in-repo))"

  # ---------------------------------------------------------------------------
  # ⚠️ THE CHART'S OWN VERIFICATION, WHICH USED TO RUN ONLY AT RELEASE TIME.
  #
  # The `chart` job above lints and renders and never contacts a cluster. The
  # `stack` job below installs via install.sh — the SCRIPT path, not the chart. So
  # until this job existed, nothing on a pull request ever installed the chart or
  # ran `helm test`, and the only place that did was the publish workflow, on a tag.
  #
  # That is exactly how chart 0.2.0 reached the registry with `helm test --logs`
  # exiting 1 on a chart where all four hooks reported Phase: Succeeded — a green
  # result reported as red, on the command the chart README tells people to run.
  # Registry versions are immutable, so it is still there.
  #
  # ⚠️ ITS OWN CLUSTER, NOT A STEP ON `stack`. The chart's default namespaces are
  # monitoring, gpu-operator and llm-sim — the same ones install.sh uses — so
  # installing it after `task local:up` collides: Helm will not adopt resources it
  # does not own.
  #
  # The steps are a composite action because publish-chart.yml runs the identical
  # sequence against the PUBLISHED artefact. Same procedure, two subjects, one
  # implementation.
  # ---------------------------------------------------------------------------
  chart-cluster:
    name: chart on kind (helm test, foreign Prometheus)
    # `always()` with the inverted second test, for the reasons the `compose` job
    # states. It matters most HERE: this is a REQUIRED check, so a skip caused by a
    # failed `changes` job was reported to the ruleset as a pass.
    needs: [changes, fast]
    if: ${{ !cancelled() && needs.fast.result == 'success' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    # ⚠️ 60, NOT 30, AND THE OLD CAP WAS BELOW THIS JOB'S OWN WAITS. The composite
    # action serialises five bounded waits — kind `--wait 5m`, kube-prometheus-stack
    # `--timeout 15m`, the negative install `10m`, the real install `15m`, the Grafana
    # rollout `5m` — which is 50 minutes before the dashboard poll starts. A healthy
    # run is 4m09s (docs/ci.md), so 30 never bit on green and only ever guillotined a
    # broken run: precisely what the `stack` job's 90-minute cap is written to avoid
    # ("a cap below the worst case would guillotine the BROKEN run, which is the one
    # whose diagnostics matter"). Re-derive this if the action's timeouts change.
    timeout-minutes: 60
    env:
      # The `secrets` context is not available in a step-level `if`, so it is
      # collapsed to a boolean here, exactly as the `stack` and `compose` jobs do.
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ⚠️ THIS JOB PULLS FROM DOCKER HUB TOO, and was the only one of the four that
      # did not log in. It pulls `kindest/node` for the cluster and `grafana/grafana`
      # via kube-prometheus-stack, which is the same rate-limited anonymous path the
      # workflow header is written about — on the required check most exposed to it.
      # Gated on the secrets existing, so a fork PR still runs.
      - name: Log in to Docker Hub (skipped without secrets)
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⚠️ kubectl IS PINNED HERE NOW. This job used the runner image's copy — the
      # only cluster job in the repo that did — while the env block above pins
      # KUBECTL_VERSION to track the node image's minor and docs/ci.md states that
      # coupling as a rule. A skew this job cannot see is a skew it cannot report.
      - name: Install pinned Helm and kubectl
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -fsSLo /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/helm.tgz linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"

          curl -fsSLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $HOME/.local/bin/kubectl" | sha256sum -c -

          chmod +x "$HOME"/.local/bin/*
          helm version --short

      # The chart cannot be installed from charts/ — .Files.Get cannot read outside
      # the chart directory, so the dashboards and rules are assembled into dist/.
      - name: Build the chart into dist/
        run: python3 scripts/chart-build.py

      # ⚠️ kind-version IS PASSED EXPLICITLY. The action's own default sat at v0.30.0
      # while this file pins v0.32.0 — and the cluster it builds uses kind/gpu-sim.yaml,
      # which pins kindest/node:v1.36.1 as "the image kind v0.32.0 ships as its
      # default". A v0.32-era node image on a v0.30 binary is the mismatch that file's
      # own comment calls a documented way to get a cluster that never becomes Ready.
      # check-doc-claims.py now asserts the three agree, so this cannot drift again.
      - name: Install it against a foreign Prometheus and helm test it
        uses: ./.github/actions/verify-chart
        with:
          chart: dist/charts/k8s-ai-observability
          kind-version: ${{ env.KIND_VERSION }}

  # ---------------------------------------------------------------------------
  # The real test: a kind cluster, both Helm releases, all the wiring, and every
  # acceptance check.
  # ---------------------------------------------------------------------------
  stack:
    # The matrix value is in the name deliberately: these become two separate required
    # status checks ("full stack on kind (full)" / "(lite)"), so a ruleset can require
    # both and a red lite leg cannot hide behind a green full one.
    name: full stack on kind (${{ matrix.profile }})
    # ⚠️ `!cancelled()`, NOT `always()`, AND THE DIFFERENCE IS 13 RUNNER-MINUTES PER
    # SUPERSEDED PUSH. `always()` returns true even when the run has been CANCELLED, so
    # a branch push that supersedes an in-flight run left both legs of this matrix
    # running to completion anyway — quietly defeating `cancel-in-progress`, which is
    # the whole reason the concurrency group exists. GitHub's own guidance is to prefer
    # `!cancelled()` for "run regardless of success or failure".
    #
    # Everything the block below argues is preserved: when `fast` FAILS, `!cancelled()`
    # is still true, so this job still RUNS, the matrix still expands, and both required
    # names still report. Only genuine cancellation now skips it — and a cancelled run
    # is one whose checks nobody is waiting on, because the run that superseded it is.
    #
    # ⚠️ `if: always()` IS WHAT MAKES `needs: fast` SAFE HERE, and without it this job
    # would reintroduce the exact bug the block below documents. `fast` is 9-12s and
    # covers the selftests, doc-claims, the rule tests and both syntax passes; when it
    # is red these two legs are ~14 runner-minutes spent proving something already
    # known to be broken. But gating a MATRIX job with a bare `needs:` means a failed
    # dependency SKIPS it, and a skipped matrix job does not interpolate its name — so
    # the two required checks would never report and the PR would sit pending, exactly
    # as it did under a job-level `if:`. Running always and gating the STEPS on
    # RUN_STACK keeps both names reporting whatever `fast` did.
    # ⚠️ THE GATE IS ON THE STEPS, NOT THE JOB, AND THAT IS NOT A STYLE CHOICE.
    #
    # A job-level `if:` was tried first and blocked a docs-only PR outright. When a
    # MATRIX job is skipped, GitHub does not interpolate its name — the check reports
    # as the literal "full stack on kind (${{ matrix.profile }})". The ruleset on main
    # requires "full stack on kind (full)" and "(lite)", so those two names never
    # reported at all and the PR sat pending forever. Exactly the failure that made
    # `paths-ignore:` unusable, reintroduced one layer down.
    #
    # Gating the steps keeps the job running, so the matrix expands, both names report,
    # and the ruleset is satisfied. The cost is a runner spin-up per leg — seconds
    # against the ~6.5 minutes each leg takes when it has real work to do.
    needs: [changes, fast]
    if: ${{ !cancelled() }}
    strategy:
      # NOT fail-fast. If lite breaks while full passes, that difference IS the signal
      # — cancelling the healthy leg to save four minutes would throw away the
      # comparison that tells you which profile is at fault.
      fail-fast: false
      matrix:
        profile: [full, lite]
    runs-on: ubuntu-24.04
    # Derived from the repo's OWN timeouts, not guessed:
    #   install.sh:40  helm kube-prometheus-stack  --wait --timeout 15m
    #   install.sh:45  rollout status operator     --timeout=5m
    #   install.sh:64  helm fake-gpu-operator      --wait --timeout 15m
    #   install.sh:80  rollout status per DaemonSet --timeout=5m x N  (N unbounded in source)
    #   install.sh:98  llm-steady + llm-saturated  3m each
    #   verify.sh      polling loops                ~20m  (36x10s is the longest)
    #                  ^ was ~16m; checks 3 and 4c went 60s -> 120s each (three loops,
    #                    so +3m worst case) after a slow runner missed the first DCGM
    #                    scrape inside 60s. Still far under the cap below.
    # MEASURED: N=3 (device-plugin, mig-faker, nvidia-dcgm-exporter), so the worst case
    # is ~75 min. Every rollout wait is `|| true`, so a partially-broken cluster does
    # NOT fail fast — it walks every timeout, then fails in verify.sh. A cap below the
    # worst case would guillotine the BROKEN run, which is the one whose diagnostics
    # matter, hence the wide margin over the healthy case.
    #
    # A healthy run measured 5m17s — far under the 15-25 min originally estimated.
    # If a green run ever approaches 35 min, something is waiting that should not be.
    # Re-derive this cap if install.sh's timeouts or the DaemonSet count change.
    timeout-minutes: 90
    # The `secrets` context cannot be used in a job- or step-level `if`, so it is
    # collapsed to a boolean here and tested via the env context below.
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # The one gate every step below reads. Two independent reasons to stand nothing
      # up — nothing but markdown changed, or `fast` already found the answer — and
      # collapsing them here keeps the condition on eight steps from drifting apart.
      # Each reason gets its own ::notice:: below, because "this green means nothing
      # ran" and WHY are different things to tell the reader.
      #
      # ⚠️ `!= 'false'`, NOT `== 'true'`, AND THAT IS A THIRD REASON THIS JOB CAN GO
      # GREEN. A `changes` job that FAILED emits no output at all, and `'' == 'true'`
      # is false — so both legs of the matrix reported success in three seconds
      # without standing anything up, and the first notice below told the reader it
      # was a docs-only change. Since `changes` is not itself a required check, all
      # four required checks were green on a pull request nothing had verified. The
      # filter script is meticulously fail-open; only the job around it was not.
      # `!= 'false'` makes an absent answer mean "run it", which is the same posture
      # the script takes for an unreachable base commit.
      RUN_STACK: ${{ needs.changes.outputs.code != 'false' && needs.fast.result == 'success' }}
      # scripts/config.sh does LITE="${LITE:-0}", and :- treats empty as unset, so the
      # 'full' leg passing '' is exactly equivalent to not setting it at all.
      #
      # ⚠️ WHAT THIS LEG DOES AND DOES NOT PROVE. It proves the trimmed stack FUNCTIONS:
      # Prometheus starts, the rules evaluate, the sidecar imports both boards, and
      # every acceptance check still passes with Alertmanager, kube-state-metrics and
      # node-exporter absent. It proves NOTHING about the 3 GiB floor — this runner has
      # ~16 GB, so nothing here is under memory pressure. That claim needs a constrained
      # local run (colima --memory 4) and is stated as unverified in values-lite.yaml.
      LITE: ${{ matrix.profile == 'lite' && '1' || '' }}
    steps:
      # Says out loud what this job's green means when the gate is off.
      #
      # Gating the STEPS keeps the required check names reporting, but it costs the one
      # honest signal a job-level `if:` gave for free: a skipped job says "skipped",
      # whereas this one says "success" in 3 seconds without standing anything up. A
      # check named "full stack on kind" going green without a stack is the hollow-green
      # failure this repo writes assertions against, so it does not get to be silent.
      #
      # ::notice:: puts it on the run summary, not just in a collapsed log. The job NAME
      # cannot carry it — that string has to stay byte-identical or the ruleset on main
      # stops matching the check, which is the bug the step-level gate exists to fix.
      # ⚠️ THE FIRST TEST IS NOT REDUNDANT. Without it this step also fired when the
      # `changes` job FAILED — an empty output is `!= 'true'` — and told the reader
      # "only markdown changed" about a run where nothing was known about the diff at
      # all. A wrong diagnosis is worse than none: it closes the question.
      - name: Docs-only change — the stack was NOT stood up
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
        run: |
          echo "::notice title=Stack not verified::Only markdown changed, so every step in this job was skipped. This green means 'nothing here could have been affected', NOT 'the stack was stood up and passed'."

      # The third way this job reaches a conclusion without standing anything up, and
      # the only one that is a fault rather than a decision. It cannot be silent: the
      # steps below now RUN in this case (RUN_STACK is `!= 'false'`), so this notice
      # exists to say that the cluster came up despite the gate having no answer,
      # rather than because of one.
      - name: The changes filter failed — running everything
        if: needs.changes.result != 'success'
        run: |
          echo "::notice title=Change detection failed::The 'what changed' job did not succeed, so this run could not tell whether the diff touches anything a cluster tests. Failing open: the stack was stood up in full. Fix that job — its failure used to make every required check go green with nothing verified."

      # The other way this job goes green without standing anything up. Says which of
      # the two it was, so a reader is never left inferring it from the run graph.
      - name: The fast job failed — the stack was NOT stood up
        if: needs.changes.outputs.code == 'true' && needs.fast.result != 'success'
        run: |
          echo "::notice title=Stack not verified::The 'fast' job did not pass, so this job stood nothing up. Fix that first — its checks are seconds and cover the selftests, doc-claims, the rule tests and both syntax passes. This green means 'not attempted', NOT 'passed'."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_STACK == 'true'

      # Gated on the secrets existing — see the header. Forks get the unauthenticated
      # path: flakier, but it runs.
      - name: Log in to Docker Hub (skipped without secrets)
        if: env.RUN_STACK == 'true' && env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⚠️ DO NOT REMOVE — and if a later run passes without it, that is luck, not proof.
      #
      # Nothing in this repo raises these limits, and kind in CI routinely exhausts
      # them: the Prometheus Operator, Prometheus, Grafana's dashboard sidecar,
      # kube-state-metrics, node-exporter, the device plugin, the DCGM exporter and two
      # llm-sim pods all establish watches on a shared host kernel.
      #
      # The symptom MISDIRECTS. On exhaustion the Grafana sidecar silently never
      # imports the dashboard ConfigMaps, so verify.sh check 4 PASSES (the ConfigMap
      # exists regardless) while check 4b 404s — and 4b's own message says "sidecar not
      # imported it yet?", which reads like a timing problem. The natural response is to
      # raise the polling loop and watch it fail again. If you ever see 4 pass and 4b
      # 404 here, check these limits before touching anything else.
      - name: Raise inotify limits (kind + Prometheus stack exhaust the defaults)
        if: env.RUN_STACK == 'true'
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Install pinned toolchain
        if: env.RUN_STACK == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Every artefact is summed before it is used. The tarballs land in a file
          # first rather than being piped into tar, because a pipe leaves nothing to
          # verify and checking after extraction checks something already unpacked.
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $HOME/.local/bin/kind" | sha256sum -c -

          curl -fsSLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $HOME/.local/bin/kubectl" | sha256sum -c -

          curl -fsSLo /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/helm.tgz linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"

          curl -fsSLo /tmp/task.tgz \
            "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz"
          echo "${TASK_SHA256}  /tmp/task.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/task.tgz task
          mv /tmp/task "$HOME/.local/bin/task"

          chmod +x "$HOME"/.local/bin/*

      # Two-part, because `task tools` alone is NOT sufficient here: it marks
      # kubectl/helm/curl/python3 fatal but kind and docker OPTIONAL — deliberately, so
      # it is not red for someone who only uses a cloud target. Those two are exactly
      # what this job depends on, so a silently failed kind install would let
      # `task tools` exit 0 and only surface ~12 minutes later inside kind-up.sh.
      - name: Preflight
        if: env.RUN_STACK == 'true'
        run: |
          set -euo pipefail
          task tools
          kind version
          kubectl version --client
          helm version --short
          docker info >/dev/null

      # Phase 1 (scripts/kind-up.sh) -> Phase 2 (scripts/install.sh) -> verify.sh.
      #
      # Deliberately NOT helm/kind-action or an inline `kind create cluster`:
      # kind/gpu-sim.yaml carries the run.ai/simulated-gpu-node-pool label the whole
      # stack selects on, and kind-up.sh owns both the runtime sizing preflight and the
      # rename of kind's context to gpu-sim-local that every downstream script expects.
      # A workflow that builds its own cluster stops testing what users actually run,
      # and would go green while the real entry point is broken.
      - name: task local:up
        if: env.RUN_STACK == 'true'
        id: up
        run: task local:up

      # always(), not failure(): a job that exceeds timeout-minutes is CANCELLED, and
      # failure() is not guaranteed to fire on the cancellation path — it would collect
      # nothing on the run that needs it most.
      #
      # The `up` guard is the carve-out for concurrency supersession: cancel-in-progress
      # usually kills a run before it reaches this step, in which case `up` is 'skipped'
      # and there is no cluster worth dumping. A run superseded MID-`up` still produces
      # an artifact — an accepted limitation, since Actions does not distinguish a
      # timeout cancel from a supersession cancel.
      - name: Diagnostics
        if: always() && env.RUN_STACK == 'true' && steps.up.outcome != 'skipped' && steps.up.outcome != 'success'
        run: |
          mkdir -p /tmp/diag
          d=/tmp/diag
          kind get clusters > "$d/kind-clusters.txt" 2>&1 || true

          # Bail out early if there is no cluster. Verified on a real red run: when
          # kind-up.sh's naming-invariant guard rejects a bad label it exits BEFORE
          # creating anything, and every kubectl call below then writes the same
          # "connection refused" wall into eleven separate files. That artifact is
          # worse than none — it looks like signal and is pure noise. In that case the
          # step log is the diagnostic, and it is already clear.
          # sigpipe-ok: one short line per kind cluster; bytes, not kilobytes.
          if ! kind get clusters 2>/dev/null | grep -q '[^[:space:]]'; then
            {
              echo "No kind cluster exists."
              echo
              echo "The failure happened before or during cluster creation, so kubectl"
              echo "dumps would be meaningless. Read the 'task local:up' step log — for"
              echo "a naming-invariant break, scripts/kind-up.sh prints the exact"
              echo "expected label and why the mismatch matters."
            } > "$d/NO-CLUSTER.txt"
            cat "$d/NO-CLUSTER.txt"
            ls -la "$d"
            exit 0
          fi

          # Everything below is best-effort: a broken cluster must not break the dump.
          kubectl get pods -A -o wide                          > "$d/pods.txt"          2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp       > "$d/events.txt"        2>&1 || true
          # A missing nvidia.com/gpu allocatable is the signature of the three-way
          # naming-invariant break (node label value vs topology pool vs node selector).
          kubectl get nodes -o json                            > "$d/nodes.json"        2>&1 || true
          kubectl get ds,deploy -A -o wide                     > "$d/workloads.txt"     2>&1 || true
          kubectl get servicemonitor,prometheusrule -A         > "$d/crds.txt"          2>&1 || true
          kubectl get cm -n monitoring -l grafana_dashboard=1  > "$d/dashboard-cms.txt" 2>&1 || true

          # N for the timeout arithmetic above — install.sh waits 5m per DaemonSet.
          kubectl -n gpu-operator get ds                       > "$d/fake-gpu-ds.txt"   2>&1 || true

          for p in $(kubectl get pods -A -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            ns="${p%%/*}"; name="${p##*/}"
            [ "$name" = "" ] && continue
            kubectl -n "$ns" describe pod "$name" >> "$d/describe-notready.txt" 2>&1 || true
          done

          for ns in gpu-operator llm-sim monitoring; do
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "### $ns/$pod" >> "$d/logs-$ns.txt"
              kubectl -n "$ns" logs "$pod" --all-containers --tail=200 >> "$d/logs-$ns.txt" 2>&1 || true
            done
          done

          # The most common real failure is a scrape target down or a rule not yet
          # evaluated — neither is visible from pod status alone.
          # Service name is "${KPS_RELEASE}-prometheus"; KPS_RELEASE is
          # "kube-prometheus-stack" (scripts/config.sh:23).
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090 >/dev/null 2>&1 &
          pf=$!; sleep 5
          curl -sf http://localhost:9090/api/v1/targets > "$d/prom-targets.json" 2>&1 || true
          curl -sf http://localhost:9090/api/v1/rules   > "$d/prom-rules.json"   2>&1 || true
          kill "$pf" 2>/dev/null || true; wait "$pf" 2>/dev/null || true

          echo "--- collected ---"; ls -la "$d"

      - name: Upload diagnostics
        if: always() && env.RUN_STACK == 'true' && steps.up.outcome != 'skipped' && steps.up.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # ⚠️ matrix.profile is REQUIRED here. Both legs upload on failure, and two
          # artifacts of the same name in one run collide — you would get one bundle
          # and no way to tell which profile produced it, on the run where that is the
          # only question that matters.
          name: diagnostics-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/diag
          retention-days: 14
          if-no-files-found: warn
