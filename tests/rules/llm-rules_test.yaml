# Unit tests for manifests/alerts/llm-prometheusrule.yaml.
#
# Run with ./scripts/rule-tests.sh (or `task rule-tests`) — it extracts the rule file
# from the PrometheusRule CR and drops it next to this file, which is why rule_files
# below is a bare name rather than a path into manifests/.
#
# HISTOGRAM INPUT. The `le` values below are genuine members of TTFT_BUCKETS /
# TPOT_BUCKETS in scripts/llm-sim.py — a subset, not an invention, because
# histogram_quantile only reads the bucket the quantile lands in and the one beneath
# it, and 23 boundaries per tenant would bury the arithmetic being asserted. Each
# tenant's observations are placed entirely inside ONE bucket, which makes the
# expected p95 a two-term calculation anyone can check by hand rather than a number
# that came out of a run.
#
# ⚠️ WHAT THESE TESTS DO NOT PIN: the rate() WINDOW. Every counter below rises
# linearly, so rate(x[5m]) and rate(x[1m]) return the same value and narrowing a
# window would go unnoticed. Pinning it needs a counter whose slope changes inside
# the window, which drags Prometheus's rate extrapolation into every expected value
# and costs more in legibility than the regression is worth — the window is in the
# rule's own name (`..._rate5m`, `..._5m`), where a change is visible in review.
rule_files:
  - llm-rules.yaml

evaluation_interval: 30s

tests:
  # =========================================================================
  # THE by (model_name) INVARIANT — the one the rule file flags with ⚠️, and
  # the reason two simulators run at all. A global quantile would merge the
  # healthy tenant into the saturated one and describe neither.
  #
  # steady:    every TTFT in (0.08, 0.1]  -> p95 = 0.08 + 0.02*0.95 = 0.099
  # saturated: every TTFT in (40, 80]     -> p95 = 40   + 40  *0.95 = 78
  #
  # Those two straddle the 2s LLMHighTTFT threshold on purpose: it is the same
  # arrangement manifests/llm/10-profiles.yaml produces on a live cluster, so a
  # threshold change that silently caught the healthy tenant fails here first.
  #
  # ⚠️ THE SATURATED BUCKET CHANGED WITH THE V1 SYNC, and re-deriving it is the
  # reason this file is worth having. It used to place mass in (45, 60] and
  # expect 59.25. V1 has neither boundary — its TTFT tail is 20/40/80/160/...
  # so the same ~58s latency now lands in (40, 80], a 40s-wide bucket rather
  # than a 15s-wide one, and the reported p95 moves 59.25 -> 78 with the
  # SIMULATED LATENCY COMPLETELY UNCHANGED. That gap is the whole argument for
  # transcribing boundaries rather than inventing them: nothing about the
  # modelled server moved, only the resolution it is measured at.
  #
  # The steady tenant's two boundaries (0.08, 0.1) are identical in v0 and V1,
  # so its three expectations below are untouched — which is the control.
  # =========================================================================
  - interval: 30s
    name: TTFT p95 is per-tenant, and the alert catches only the saturated one
    input_series:
      # ---- steady: all mass in (0.08, 0.1] --------------------------------
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.01"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.08"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.1"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="2.5"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="80.0"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-steady", le="+Inf"}'
        values: '0+10x40'

      # ---- saturated: all mass in (40, 80] --------------------------------
      # 40.0 and 80.0 are consecutive members of V1's TTFT_BUCKETS. The old
      # 45.0/60.0 pair does not exist upstream at all.
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="0.01"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="0.08"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="0.1"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="2.5"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="40.0"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="80.0"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-llama-3-8b-saturated", le="+Inf"}'
        values: '0+10x40'

    promql_expr_test:
      # Two series, not one. If the `by (model_name)` were dropped this collapses to
      # a single number and the assertion below cannot be satisfied at all.
      - expr: llm:ttft:p95_5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:ttft:p95_5m{model_name="sim-llama-3-8b-saturated", source="simulated"}'
            value: 78
          - labels: 'llm:ttft:p95_5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 0.099

      # p50 and p99 bracket p95 within the same bucket, which is what confirms the
      # quantile argument is wired to the right rule — three rules differing by one
      # literal are easy to transpose and impossible to spot by reading.
      - expr: llm:ttft:p50_5m{model_name="sim-llama-3-8b-steady"}
        eval_time: 10m
        exp_samples:
          - labels: 'llm:ttft:p50_5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 0.09
      - expr: llm:ttft:p99_5m{model_name="sim-llama-3-8b-steady"}
        eval_time: 10m
        exp_samples:
          - labels: 'llm:ttft:p99_5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 0.0998

    alert_rule_test:
      # for: 2m has not elapsed yet.
      - eval_time: 1m
        alertname: LLMHighTTFT
        exp_alerts: []

      # EXACTLY ONE alert. The healthy tenant sitting 20x under the threshold is as
      # much of the assertion as the saturated one being over it: a rule that fired
      # for both would still "work" on a live cluster and be useless.
      - eval_time: 10m
        alertname: LLMHighTTFT
        exp_alerts:
          - exp_labels:
              severity: warning
              model_name: sim-llama-3-8b-saturated
              source: simulated
            exp_annotations:
              summary: "Model sim-llama-3-8b-saturated p95 time-to-first-token above 2s"
              description: "p95 TTFT has been over 2s for 2m (78.00s). Requests are queueing faster than they can be served (simulated)."

  # =========================================================================
  # THE 2s THRESHOLD, pinned against V1's boundaries specifically.
  #
  # The V1 sync moved TTFT's tail, so "does 2s still separate the tenants?"
  # stopped being answerable by inspection and had to be checked. It does, and
  # this block is why that is not taken on trust again.
  #
  # 2 is NOT a bucket boundary in either layout — V1 runs ... 0.75, 1.0, 2.5 ...
  # so the threshold sits INSIDE (1.0, 2.5]. The block above proves the rule
  # works with three orders of magnitude of daylight either side; this one
  # brackets it as tightly as can be done PORTABLY.
  #
  # ⚠️ "PORTABLY" IS A REAL CONSTRAINT — read this before tightening the bracket.
  # The obvious test is a tenant inside (1.0, 2.5] itself, whose p95 is
  # 1.0 + 1.5*0.95 = 2.425. That test was written, passed on arm64, and went RED
  # in CI on amd64, because the two returned values one ULP apart:
  #
  #     arm64  2.4250000000000003        amd64  2.425
  #
  # promtool compares exactly, so whichever you pin, the other architecture
  # fails. The alert annotation moves with it too, flipping between "2.42s" and
  # "2.43s" under %.2f.
  #
  # WHY they differ is NOT established. Fused multiply-add in
  # `bucketStart + (bucketEnd-bucketStart)*frac` was the obvious suspect and does
  # not survive checking — evaluating that expression fused and unfused gives the
  # same double for these inputs. The divergence is somewhere else in
  # histogram_quantile or in the rate() values feeding it. Recording the observed
  # fact and NOT a mechanism, because a confident wrong explanation here would be
  # worse than none: someone would "fix" the wrong thing.
  #
  # The practical rule, which does not depend on knowing the mechanism: pin only
  # expectations verified on BOTH architectures. These are, empirically:
  #   (0.08, 0.1]  -> 0.099, 0.09, 0.0998      (block above)
  #   (0.75, 1.0]  -> 0.9875                   (below)
  #   (2.5,  5.0]  -> 4.875                    (below)
  #   (40,   80]   -> 78                       (block above)
  # Check a new one against linux/amd64 before committing it — no cluster needed:
  #
  #   ./scripts/extract.sh rules /tmp/w && cp tests/rules/*_test.yaml /tmp/w/
  #   docker run --rm --platform linux/amd64 -v "$PWD":/w -w /w \
  #     --entrypoint promtool prom/prometheus:v3.7.3 test rules /tmp/w/*_test.yaml
  #
  # None of this touches the rule: `> 2` is a comparison, and both values are
  # comfortably above 2. Only exact-equality assertions are affected.
  # =========================================================================
  - interval: 30s
    name: the 2s threshold separates correctly, on the tightest portable bracket
    input_series:
      # over: all mass in (2.5, 5.0] -> p95 = 2.5 + 2.5*0.95 = 4.875
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-over", le="2.5"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-over", le="5.0"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-over", le="+Inf"}'
        values: '0+10x40'
      # under: all mass in (0.75, 1.0] -> p95 = 0.75 + 0.25*0.95 = 0.9875
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-under", le="0.75"}'
        values: '0x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-under", le="1.0"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-under", le="2.5"}'
        values: '0+10x40'
      - series: 'vllm:time_to_first_token_seconds_bucket{model_name="sim-under", le="+Inf"}'
        values: '0+10x40'

    promql_expr_test:
      - expr: llm:ttft:p95_5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:ttft:p95_5m{model_name="sim-over", source="simulated"}'
            value: 4.875
          - labels: 'llm:ttft:p95_5m{model_name="sim-under", source="simulated"}'
            value: 0.9875

    alert_rule_test:
      # Exactly one: 2.425 > 2 fires, 0.9875 does not.
      - eval_time: 10m
        alertname: LLMHighTTFT
        exp_alerts:
          - exp_labels:
              severity: warning
              model_name: sim-over
              source: simulated
            exp_annotations:
              summary: "Model sim-over p95 time-to-first-token above 2s"
              description: "p95 TTFT has been over 2s for 2m (4.88s). Requests are queueing faster than they can be served (simulated)."

  # =========================================================================
  # TPOT. Its own block because the bucket layout is the point: the rule file
  # warns that p95 TPOT reads HIGH at this rig's operating point because the
  # (0.025, 0.05] bucket is 25ms wide. Pinning that here stops someone
  # "fixing" the apparent inflation by changing the quantile or the buckets.
  # =========================================================================
  - interval: 30s
    name: TPOT p95 interpolates across the wide 25-50ms bucket, as documented
    input_series:
      # Modelled ITL under a full batch is ~0.0225s — inside (0.01, 0.025].
      - series: 'vllm:inter_token_latency_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.01"}'
        values: '0x40'
      - series: 'vllm:inter_token_latency_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.025"}'
        values: '0+10x40'
      - series: 'vllm:inter_token_latency_seconds_bucket{model_name="sim-llama-3-8b-steady", le="0.05"}'
        values: '0+10x40'
      - series: 'vllm:inter_token_latency_seconds_bucket{model_name="sim-llama-3-8b-steady", le="+Inf"}'
        values: '0+10x40'

    promql_expr_test:
      # 0.01 + (0.025-0.01)*0.95 = 0.02425 — reported nearly double the ~0.0225s
      # actually modelled. That is the histogram's resolution, not a bug.
      - expr: llm:tpot:p95_5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:tpot:p95_5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 0.02425

  # =========================================================================
  # The two threshold alerts that are NOT driven to their boundary on the rig:
  # LLMQueueBacklog fires permanently (so a live check never sees it clear) and
  # LLMKVCacheSaturated never fires at all (the shipped profiles stay well
  # under 90%). Both boundaries only exist here.
  # =========================================================================
  - interval: 30s
    name: queue-depth and KV-cache thresholds, on both sides of the boundary
    input_series:
      # The saturated tenant plateaus around 160 waiting; the steady one at 0.
      - series: 'vllm:num_requests_waiting{model_name="sim-llama-3-8b-saturated"}'
        values: '160x40'
      - series: 'vllm:num_requests_waiting{model_name="sim-llama-3-8b-steady"}'
        values: '0x40'
      # Exactly at the threshold. `> 50` is strict — this must never fire.
      - series: 'vllm:num_requests_waiting{model_name="sim-llama-3-8b-edge"}'
        values: '50x40'

      # kv_cache_usage_perc is a FRACTION (0-1), not a percentage, which is what
      # makes `> 0.9` correct and `> 90` a rule that can never fire. 0.95 fires,
      # 0.9 does not, and the shipped profiles sit down at 0.4.
      - series: 'vllm:kv_cache_usage_perc{model_name="sim-llama-3-8b-saturated"}'
        values: '0.95x40'
      - series: 'vllm:kv_cache_usage_perc{model_name="sim-llama-3-8b-edge"}'
        values: '0.9x40'
      - series: 'vllm:kv_cache_usage_perc{model_name="sim-llama-3-8b-steady"}'
        values: '0.4x40'

    alert_rule_test:
      - eval_time: 4m
        alertname: LLMQueueBacklog
        exp_alerts: []   # for: 5m
      - eval_time: 8m
        alertname: LLMQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              model_name: sim-llama-3-8b-saturated
            exp_annotations:
              summary: "Model sim-llama-3-8b-saturated has 160 requests queued"
              description: "Offered load has exceeded serving capacity for 5m (simulated)."

      - eval_time: 8m
        alertname: LLMKVCacheSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              model_name: sim-llama-3-8b-saturated
            exp_annotations:
              summary: "Model sim-llama-3-8b-saturated KV cache above 90%"
              description: "Simulated KV-cache utilisation over 90% for 5m."

  # =========================================================================
  # LLMMetricsAbsent — never exercised on the rig, since the simulators are
  # always up.
  # =========================================================================
  - interval: 30s
    name: LLMMetricsAbsent fires when the simulators stop being scraped
    input_series:
      # Deliberately not vllm:num_requests_running — that is the one that is missing.
      - series: 'up{job="llm-sim"}'
        values: '0x40'

    alert_rule_test:
      - eval_time: 4m
        alertname: LLMMetricsAbsent
        exp_alerts: []
      - eval_time: 6m
        alertname: LLMMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No LLM serving metrics are being scraped"
              description: "vllm:num_requests_running absent for 5m — is the llm-sim ServiceMonitor matching, and are the simulator pods Running?"

  # =========================================================================
  # Cross-domain. llm:tokens_per_watt:5m reads DCGM_FI_DEV_POWER_USAGE, which is
  # itself synthesised by gpu-prometheusrule.yaml — derived layered on derived.
  # Fed here as a plain input series, which is exactly what it is by the time
  # this rule sees it, so this stays a test of one rule file rather than two.
  # =========================================================================
  - interval: 30s
    name: token rates aggregate per tenant, and tokens-per-watt spans both domains
    input_series:
      # +150 every 30s = 5 tokens/s per tenant, 10/s across the cluster.
      - series: 'vllm:generation_tokens_total{model_name="sim-llama-3-8b-steady"}'
        values: '0+150x40'
      - series: 'vllm:generation_tokens_total{model_name="sim-llama-3-8b-saturated"}'
        values: '0+150x40'
      # ⚠️ 20/s, deliberately NOT a multiple of the 10/s cluster generation rate.
      # Prompt and generation tokens are two counters one letter apart in the panel
      # queries and the recording rules, and with the obvious round numbers here the
      # cluster prompt rate came out identical to the cluster generation rate — so
      # tokens_per_watt reading the wrong counter produced the right answer and the
      # test passed. Keep these two rates incommensurable.
      - series: 'vllm:prompt_tokens_total{model_name="sim-llama-3-8b-steady"}'
        values: '0+600x40'
      # Two GPUs at 50 W = 100 W total.
      - series: 'DCGM_FI_DEV_POWER_USAGE{UUID="GPU-a", source="derived"}'
        values: '50x40'
      - series: 'DCGM_FI_DEV_POWER_USAGE{UUID="GPU-b", source="derived"}'
        values: '50x40'

    promql_expr_test:
      - expr: llm:tokens:generation_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:tokens:generation_rate5m{model_name="sim-llama-3-8b-saturated", source="simulated"}'
            value: 5
          - labels: 'llm:tokens:generation_rate5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 5
      - expr: llm:tokens:prompt_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:tokens:prompt_rate5m{model_name="sim-llama-3-8b-steady", source="simulated"}'
            value: 20

      # 10 tokens/s / 100 W. Cluster-aggregate, so no model_name survives — the
      # rule file is explicit that this demonstrates the query pattern and shows no
      # causation, the two signals being independently driven.
      - expr: llm:tokens_per_watt:5m
        eval_time: 10m
        exp_samples:
          - labels: 'llm:tokens_per_watt:5m{source="simulated"}'
            value: 0.1
